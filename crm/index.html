// jointes ; à droite, le message à écrire, en nouveau message ou en réponse dans un fil, avec des pièces jointes.
const PJ_MAX = 3.3 * 1024 * 1024;
function ouvrirEmail(leadId, contactId, { reponse: reponseDemandee = null } = {}) {
  const l = IDX.lead.get(leadId);
  const avecEmail = contactsDe(leadId).filter((c) => c.email);
  let c = avecEmail.find((x) => x.id === contactId) || avecEmail.find((x) => x.principal) || avecEmail[0] || null;
  const signature = (D.reglages.signature || SIGNATURE_DEFAUT).trim();
  const precedent = activitesDe(leadId).find((a) => (a.type === 'email_envoye' || a.type === 'brouillon') && a.meta && a.meta.fil && a.meta.objet);
  const n = (l.relances_sans_reponse || 0) + 1;
  const date = dansJours(delaiApres(n));
  const etapeTexte = n <= CADENCE.length ? `relance ${n} sur ${CADENCE.length} du rythme, dans ${delaiApres(n)} jours` : 'prise de nouvelles dans 3 mois, les relances du rythme sont faites';
  const corpsDepart = `${salutation(c)}\n\n\n\n${signature}`;
  ouvrirModale(`
    <h2>Emails avec ${esc(l.entreprise)}</h2>
    <div class="boite">
    ${D.gmail ? blocBoite(l) : ''}
    <section class="boite-ecrire" aria-label="Écrire">
    <div class="boite-tete"><h3 data-ecrire-titre>Nouveau message</h3><button type="button" class="btn petit lien" data-nouveau hidden>Écrire un nouveau message plutôt</button></div>
    <p class="de">De : <b>${esc(D.expediteur || COMPTE)}</b>.${D.gmail ? ' Le message ira dans tes Envoyés Gmail.' : ''}</p>
    ${champ('À', `<select name="a_contact">${avecEmail.map((x) => `<option value="${x.id}" ${c && x.id === c.id ? 'selected' : ''}>${esc(nomContact(x) || x.email)} (${esc(x.email)})</option>`).join('')}<option value="autre" ${c ? '' : 'selected'}>Autre adresse</option></select>`)}
    <label class="champ" data-autre ${c ? 'hidden' : ''}>Adresse<input type="email" name="a_autre" placeholder="prenom@entreprise.fr" autocomplete="off"></label>
    ${champ('Modèle', `<select name="modele"><option value="">Sans modèle</option>${D.modeles.filter((m) => m.canal !== 'sms').map((m) => `<option value="${m.id}">${esc(m.nom)}</option>`).join('')}</select>`, l.besoin ? `Ta note sur ce lead : ${esc(l.besoin)}` : '')}
    ${blocPerso(l.id)}
    ${enSession() ? `<label class="case"><input type="checkbox" name="garder" ${S.session.modeleEmail ? 'checked' : ''}> Reprendre ce modèle pour les leads suivants</label>
    <label class="case"><input type="checkbox" name="direct" ${S.session.sansConfirmation ? 'checked' : ''}> Envoyer sans me redemander pendant cet enchaînement</label>` : ''}
    ${precedent ? `<label class="case"><input type="checkbox" name="fil" ${l.relances_sans_reponse > 0 ? 'checked' : ''}> Répondre dans le fil de « ${esc(precedent.meta.objet)} » (${esc(instantLisible(precedent.date))})</label>` : ''}
    ${champ('Objet', '<input type="text" name="objet" maxlength="250" required>')}
    ${champ('Message', `<textarea name="corps" class="grand" required>${esc(corpsDepart)}</textarea>`, 'La signature est déjà dans le texte : tu peux tout modifier.')}
    ${D.gmail ? `<div class="champ pj-envoi"><span>Pièces jointes</span><ul data-pj-liste></ul><div class="actions"><label class="btn petit">Joindre des fichiers<input type="file" multiple data-pj-fichiers hidden></label></div><span class="aide">5 fichiers et 3,3 Mo en tout au plus. Au-delà, envoie ce message depuis Gmail.</span></div>` : ''}
    ${blocProchaine('apres', date, 'email', n <= CADENCE.length ? `Relance ${n}` : 'Prise de nouvelles', { aide: `${n <= CADENCE.length ? `Relance ${n} sur ${CADENCE.length}` : 'Prise de nouvelles'}, proposée d'après le rythme. Change la date si un appel est prévu.` })}
    <div class="confirmation" data-confirmation hidden></div>
    ${piedFormulaire(`<button type="button" class="btn lien" data-mode="noter">Noter sans envoyer</button>${D.gmail ? '<button type="button" class="btn" data-mode="brouillon">Brouillon</button><button type="submit" class="btn primaire" data-mode="envoyer">Envoyer</button>' : ''}`)}
    ${D.gmail ? '' : '<p class="aide">L\'envoi direct n\'est pas encore branché : copie le texte dans Gmail (vérifie la ligne De), puis note-le ici.</p>'}
    </section>
    </div>
  `, (form) => {
    brancherAnnuler(form);
    brancherPuces(form, 'apres');
    const el = form.elements;
    // Répondre dans un fil de la boîte : destinataire, objet « Re: » et en-têtes de réponse.
    let reponse = null;
    const titre = $('[data-ecrire-titre]', form);
    const nouveau = $('[data-nouveau]', form);
    const caseFil = el.fil ? el.fil.closest('label') : null;
    const repondre = (fil, ms) => {
      const dernier = ms[ms.length - 1];
      const autre = [...ms].reverse().find((m) => !m.moi);
      const adr = dernier.moi ? ((dernier.a.match(/[^\s<>,;"]+@[^\s<>,;"]+/) || [])[0] || (autre && autre.email) || '') : dernier.email;
      const objet = String(ms[0].objet || dernier.objet || '').replace(/^((re|tr|fwd?)\s*:\s*)+/i, '');
      const ct = avecEmail.find((x) => x.email.toLowerCase() === String(adr).toLowerCase());
      el.a_contact.value = ct ? ct.id : 'autre';
      if (!ct) el.a_autre.value = adr;
      el.a_contact.dispatchEvent(new Event('change'));
      modeReponse({ fil, message_id: dernier.message_id || null, references: [dernier.references, dernier.message_id].filter(Boolean).join(' ').trim(), objet });
      $('.boite-ecrire', form).scrollIntoView({ block: 'start', behavior: 'smooth' });
      el.corps.focus({ preventScroll: true });
      const debut = el.corps.value.indexOf('\n\n') + 2;
      if (debut > 1) el.corps.setSelectionRange(debut, debut);
    };
    function modeReponse(r) {
      reponse = r;
      el.objet.value = `Re: ${r.objet}`;
      if (caseFil) { el.fil.checked = false; caseFil.hidden = true; }
      titre.textContent = `Réponse à « ${r.objet} »`;
      nouveau.hidden = false;
    }
    nouveau.addEventListener('click', () => {
      reponse = null;
      titre.textContent = 'Nouveau message';
      nouveau.hidden = true;
      el.objet.value = '';
    });
    if (D.gmail) {
      const ouvert = reponseDemandee ? reponseDemandee.fil : FIL_RE.test(l.tache_fil || '') ? l.tache_fil : null;
      monterBoite(form, l.id, { ouvert, surRepondre: repondre });
    }
    // Pièces jointes à envoyer.
    let pj = [];
    const listePj = $('[data-pj-liste]', form);
    const entreePj = $('[data-pj-fichiers]', form);
    const rendrePj = () => {
      listePj.innerHTML = pj.map((f, i) => `<li><span>${esc(f.name)} <span class="meta">${esc(taillePj(f.size))}</span></span><button type="button" class="btn petit lien" data-retirer="${i}">Retirer</button></li>`).join('');
    };
    if (entreePj) {
      entreePj.addEventListener('change', () => {
        const tous = [...pj, ...entreePj.files];
        entreePj.value = '';
        const total = tous.reduce((x, f) => x + f.size, 0);
        if (tous.length > 5) { montrerErreur(form, '5 pièces jointes au plus.'); return; }
        if (tous.some((f) => !f.size)) { montrerErreur(form, 'Un des fichiers est vide.'); return; }
        if (total > PJ_MAX) { montrerErreur(form, `Trop lourd pour le CRM : ${taillePj(total)} en tout, 3,3 Mo au plus. Retire une pièce ou envoie ce message depuis Gmail.`); return; }
        $('[data-erreur]', form).hidden = true;
        pj = tous;
        rendrePj();
      });
      listePj.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-retirer]');
        if (!b) return;
        pj.splice(Number(b.dataset.retirer), 1);
        rendrePj();
      });
    }
    const lirePj = () => Promise.all(pj.map((f) => new Promise((ok, ko) => {
      const r = new FileReader();
      r.onload = () => ok({ nom: f.name, type: f.type || 'application/octet-stream', donnees: String(r.result).split(',')[1] || '' });
      r.onerror = () => ko(new Error(`Je n'arrive pas à lire « ${f.name} ».`));
      r.readAsDataURL(f);
    })));
    const objetParDefaut = () => (precedent && el.fil && el.fil.checked ? `Re: ${precedent.meta.objet.replace(/^(re|tr|fwd?)\s*:\s*/i, '')}` : '');
    el.objet.value = objetParDefaut();
    const contactChoisi = () => avecEmail.find((x) => x.id === el.a_contact.value) || null;
    el.a_contact.addEventListener('change', () => {
      $('[data-autre]', form).hidden = el.a_contact.value !== 'autre';
      c = contactChoisi();
      changerSalutation(el.corps, c);
    });
    el.modele.addEventListener('change', () => {
      const m = D.modeles.find((x) => x.id === el.modele.value);
      if (!m) return;
      if (!reponse && !(el.fil && el.fil.checked)) el.objet.value = remplirModele(m.objet, l, c);
      el.corps.value = `${remplirModele(m.corps, l, c).trim()}\n\n${signature}`;
    });
    if (el.fil) el.fil.addEventListener('change', () => { el.objet.value = el.fil.checked ? objetParDefaut() : ''; });
    if (enSession() && S.session.modeleEmail && D.modeles.some((m) => m.id === S.session.modeleEmail)) {
      el.modele.value = S.session.modeleEmail;
      el.modele.dispatchEvent(new Event('change'));
    }
    brancherPerso(form, l.id, 'email', () => (el.a_contact.value === 'autre' ? null : el.a_contact.value), (r) => {
      if (!reponse && !(el.fil && el.fil.checked) && r.objet) el.objet.value = r.objet;
      el.corps.value = `${r.corps.trim()}\n\n${signature}`;
    });
    const memoriserSession = () => {
      if (!enSession()) return;
      if (el.garder) S.session.modeleEmail = el.garder.checked ? el.modele.value || null : null;
      if (el.direct) S.session.sansConfirmation = el.direct.checked;
    };
    const destinataire = () => (el.a_contact.value === 'autre' ? el.a_autre.value.trim() : (contactChoisi() || {}).email || '');
    const verifier = () => {
      const a = destinataire();
      if (!/^[^@\s<>,;"]+@[^@\s<>,;".]+(\.[^@\s<>,;".]+)+$/.test(a)) { (el.a_contact.value === 'autre' ? el.a_autre : el.a_contact).focus(); return 'Adresse email invalide.'; }
      if (!el.objet.value.trim()) { el.objet.focus(); return "Il manque l'objet."; }
      if (!el.corps.value.trim()) { el.corps.focus(); return 'Le message est vide.'; }
      for (const zone of [el.objet, el.corps]) {
        const reste = zone.value.match(/\{[a-z_]+\}/);
        if (reste) {
          const i = zone.value.indexOf(reste[0]);
          zone.focus();
          zone.setSelectionRange(i, i + reste[0].length);
          return `Remplace ${reste[0]} par ton texte : il est sélectionné dans le message.`;
        }
      }
      return '';
    };
    const majLead = (mode = 'envoyer') => {
      // Un brouillon n'est pas une relance : il reste dans Aujourd'hui jusqu'à l'envoi.
      if (mode === 'brouillon') return { prochaine_relance: aujourdhui(), prochaine_action: 'email', prochaine_note: `Brouillon à envoyer : « ${el.objet.value.trim()} »` };
      const p = lireProchaine(form, 'apres');
      const m = { ...p, relances_sans_reponse: n, dernier_contact: aujourdhui() };
      if (l.statut === 'nouveau') m.statut = 'contacte';
      return m;
    };
    const envoyer = (mode) => soumettre(form, async () => {
      const a = destinataire();
      const ch = contactChoisi();
      const fil = reponse ? { fil: reponse.fil, message_id: reponse.message_id, references: reponse.references } : el.fil && el.fil.checked && precedent ? precedent.meta : null;
      memoriserSession();
      if (mode === 'noter') {
        await journal(l.id, { type: 'email_envoye', resume: `Email envoyé à ${a} : « ${el.objet.value.trim()} »${pj.length ? ` (pièces jointes : ${pj.map((f) => f.name).join(', ')})` : ''}`, contenu: el.corps.value, contact_id: ch ? ch.id : null, source: 'crm' }, majLead());
        fermerModale();
        toast("Noté dans l'historique.");
        actionFaite(l.id, 'email');
        return;
      }
      const r = await api('POST', {
        op: 'email', mode, lead_id: l.id, contact_id: ch ? ch.id : null, a, objet: el.objet.value.trim(), corps: el.corps.value,
        fil: fil ? fil.fil : null, en_reponse_a: fil ? fil.message_id : null, references: fil && fil.references ? fil.references : null, lead: majLead(mode),
        pieces: pj.length ? await lirePj() : undefined,
      });
      BOITES.delete(l.id);
      if (fil) FILS_LUS.delete(fil.fil);
      ajouterActivite(r.activite);
      remplacerLead(r.lead);
      indexer();
      rendre();
      if (S.fiche) rendreFiche();
      fermerModale();
      if (!r.journal) toast(mode === 'brouillon' ? "Brouillon créé, mais pas noté dans l'historique : ajoute une note." : "L'email est parti, mais il n'a pas été noté dans l'historique : ajoute une note.", 6000);
      else if (mode === 'brouillon') toast("Brouillon créé dans gabriel@ia-entrepreneur.fr. Il reste dans Aujourd'hui jusqu'à l'envoi.", 5000);
      else toast(`Email envoyé à ${a}.`);
      actionFaite(l.id, mode === 'brouillon' ? 'brouillon' : 'email');
    });
    $$('[data-mode]', form).forEach((b) => b.addEventListener('click', (ev) => {
      ev.preventDefault();
      const probleme = verifier();
      if (probleme) { montrerErreur(form, probleme); return; }
      $('[data-erreur]', form).hidden = true;
      const mode = b.dataset.mode;
      if (mode !== 'envoyer' || (enSession() && el.direct && el.direct.checked)) { envoyer(mode); return; }
      const conf = $('[data-confirmation]', form);
      conf.hidden = false;
      conf.innerHTML = `<p>Envoyer maintenant à <b>${esc(destinataire())}</b> depuis <b>${esc(D.expediteur || COMPTE)}</b>${pj.length ? `, avec ${pj.length} pièce${pj.length > 1 ? 's' : ''} jointe${pj.length > 1 ? 's' : ''}` : ''}${reponse ? `, en réponse dans le fil « ${esc(reponse.objet)} »` : ''} ?</p>
        <div class="actions"><button type="button" class="btn" data-revenir>Revenir</button><button type="button" class="btn primaire" data-confirmer>Oui, envoyer</button></div>`;
      conf.scrollIntoView({ block: 'nearest' });
      $('[data-revenir]', conf).addEventListener('click', () => { conf.hidden = true; });
      $('[data-confirmer]', conf).addEventListener('click', () => envoyer('envoyer'));
    }));
    form.addEventListener('submit', (ev) => ev.preventDefault());
    // Avec la boîte Gmail, la case « Répondre dans le fil » devient le mode réponse (la relance part dans le dernier fil envoyé).
    if (D.gmail && caseFil) {
      caseFil.hidden = true;
      if (el.fil.checked && !reponseDemandee && precedent) modeReponse({ fil: precedent.meta.fil, message_id: precedent.meta.message_id || null, references: '', objet: precedent.meta.objet.replace(/^((re|tr|fwd?)\s*:\s*)+/i, '') });
      el.fil.checked = false;
    }
    if (reponseDemandee && reponseDemandee.ms && reponseDemandee.ms.length) repondre(reponseDemandee.fil, reponseDemandee.ms);
  }, { large: Boolean(D.gmail) });
}

/* ----- Appel ----- */

function ouvrirAppel(leadId) {
  const l = IDX.lead.get(leadId);
  const c = contactJoignable(leadId) || contactPrincipal(leadId);
  const tel = telephoneDe(l);
  ouvrirModale(`
    <h2>Appel avec ${esc(l.entreprise)}</h2>
    ${tel ? `<p><a class="btn petit" href="${esc(telLien(tel))}">Appeler le ${esc(tel)}</a></p>` : ''}
    <fieldset><legend>Résultat</legend><div class="puces" data-resultat>
      <button type="button" data-v="joint" aria-pressed="false">Joint</button>
      <button type="button" data-v="sans_reponse" aria-pressed="false">Pas de réponse</button>
      <button type="button" data-v="message" aria-pressed="false">Message laissé</button>
    </div></fieldset>
    ${contactsDe(leadId).length ? champ('Avec', `<select name="contact">${optionsContacts(leadId, c && c.id)}</select>`) : ''}
    ${champ('Ce qui s\'est dit', '<textarea name="note" placeholder="Intéressé par le niveau 2, rappeler après le comité du 20…"></textarea>')}
    ${champ('Étape', `<select name="statut">${options(STATUTS, l.statut === 'nouveau' ? 'contacte' : l.statut)}</select>`)}
    ${blocProchaine('apres', dansJours(7), 'email', '')}
    ${piedFormulaire('<button type="submit" class="btn primaire">Enregistrer</button>')}
  `, (form) => {
    brancherAnnuler(form);
    brancherPuces(form, 'apres');
    let resultat = '';
    const n = (l.relances_sans_reponse || 0) + 1;
    $$('[data-resultat] button', form).forEach((b) => b.addEventListener('click', () => {
      resultat = b.dataset.v;
      $$('[data-resultat] button', form).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      const el = form.elements;
      el.apres_date.value = resultat === 'joint' ? dansJours(7) : dansJours(delaiApres(n));
      el.apres_action.value = resultat === 'joint' ? 'email' : 'appel';
      el.apres_date.dispatchEvent(new Event('input'));
    }));
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      soumettre(form, async () => {
        const el = form.elements;
        if (!resultat) throw new ErreurApi("Choisis le résultat de l'appel.");
        const joint = resultat === 'joint';
        const note = el.note.value.trim();
        const lib = { joint: 'Appel, joint', sans_reponse: 'Appel sans réponse', message: 'Appel, message laissé' }[resultat];
        const maj = { ...lireProchaine(form, 'apres'), statut: el.statut.value, relances_sans_reponse: joint ? 0 : n };
        if (joint) maj.dernier_contact = aujourdhui();
        await journal(l.id, { type: joint ? 'appel' : 'appel_sans_reponse', resume: note ? `${lib} : ${note}` : lib, contact_id: el.contact ? el.contact.value || null : null, source: 'crm' }, maj);
        fermerModale();
        toast('Appel noté.');
        actionFaite(l.id, 'appel');
      });
    });
  });
}

/* ----- Décaler ----- */

function ouvrirDecaler(leadId) {
  const l = IDX.lead.get(leadId);
  ouvrirModale(`
    <h2>Décaler la relance</h2>
    <p class="aide">${esc(l.entreprise)}. ${l.prochaine_relance ? `Prévue ${esc(quand(l.prochaine_relance))}.` : 'Aucune relance prévue pour le moment.'} Une puce enregistre tout de suite. Décaler ne compte pas comme une relance.</p>
    ${blocProchaine('apres', l.prochaine_relance || dansJours(1), l.prochaine_action, l.prochaine_note)}
    ${piedFormulaire('<button type="submit" class="btn primaire">Enregistrer</button>')}
  `, (form) => {
    brancherAnnuler(form);
    brancherPuces(form, 'apres', { direct: true });
    const avant = { prochaine_relance: l.prochaine_relance, prochaine_action: l.prochaine_action, prochaine_note: l.prochaine_note };
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      soumettre(form, async () => {
        const p = lireProchaine(form, 'apres');
        const texte = p.prochaine_relance
          ? `Relance déplacée au ${dateLongue(p.prochaine_relance)} (${actionLue(p.prochaine_action).toLowerCase()})${p.prochaine_note ? ` : ${p.prochaine_note}` : ''}`
          : `Plus de relance prévue${p.prochaine_note ? ` : ${p.prochaine_note}` : ''}`;
        const r = await journal(l.id, { type: 'relance_decalee', resume: texte, source: 'crm' }, p);
        fermerModale();
        toast(p.prochaine_relance ? `Relance ${quand(p.prochaine_relance)}.` : 'Plus de relance prévue.', 3200, () => annulerAction(l.id, r.activite, avant));
        actionFaite(l.id, 'decale');
      });
    });
  });
}

/* ----- Rendez-vous ----- */

function ouvrirRdv(leadId) {
  const l = IDX.lead.get(leadId);
  const c = contactPrincipal(leadId);
  ouvrirModale(`
    <h2>Rendez-vous avec ${esc(l.entreprise)}</h2>
    <div class="deux">
      ${champ('Date', `<input type="date" name="date" required value="${esc(dansJours(3))}">`)}
      ${champ('Heure', '<input type="time" name="heure" value="10:00">')}
    </div>
    ${champ('Où', '<input type="text" name="lieu" placeholder="Visio, dans leurs locaux à Nancy…">')}
    ${D.agenda ? `<div class="deux">${champ('Durée', `<select name="duree">${options([['30', '30 minutes'], ['45', '45 minutes'], ['60', '1 heure'], ['90', '1 h 30']], '30')}</select>`)}<label class="case" style="align-self:end;padding-bottom:10px"><input type="checkbox" name="agenda" checked> Ajouter à mon agenda Google</label></div>` : ''}
    ${contactsDe(leadId).length ? champ('Avec', `<select name="contact">${optionsContacts(leadId, c && c.id)}</select>`) : ''}
    ${champ('Objet du RDV (facultatif)', '<textarea name="note" placeholder="Présenter le niveau 2, découverte des besoins…"></textarea>')}
    ${champ('Étape', `<select name="statut">${options(STATUTS, ['nouveau', 'contacte'].includes(l.statut) ? 'qualifie' : l.statut)}</select>`)}
    <p class="aide">La prochaine relance devient ce rendez-vous. Pense à l'ajouter à ton agenda.</p>
    ${piedFormulaire('<button type="submit" class="btn primaire">Enregistrer</button>')}
  `, (form) => {
    brancherAnnuler(form);
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      soumettre(form, async () => {
        const el = form.elements;
        if (!el.date.value) throw new ErreurApi('Choisis une date.');
        const heure = el.heure.value ? ` à ${el.heure.value.replace(/^0/, '').replace(/:00$/, ' h').replace(':', ' h ')}` : '';
        const ou = el.lieu.value.trim();
        const note = el.note.value.trim();
        const texte = `RDV prévu le ${dateLongue(el.date.value)}${heure}${ou ? `, ${ou}` : ''}${note ? ` : ${note}` : ''}`;
        const ct = el.contact ? contactsDe(l.id).find((x) => x.id === el.contact.value) : null;
        const agenda = el.agenda && el.agenda.checked ? { agenda: {
          date: el.date.value, heure: el.heure.value || null, duree: Number(el.duree.value), lieu: ou || null,
          titre: `RDV ${l.entreprise}${ct && nomContact(ct) ? ` avec ${nomContact(ct)}` : ''}`,
          description: [note, ct && ct.email, ct && ct.telephone].filter(Boolean).join('\n'),
        } } : {};
        const rRdv = await journal(l.id, { type: 'rdv', resume: texte, contact_id: el.contact ? el.contact.value || null : null, source: 'crm', meta: { date_rdv: el.date.value, heure: el.heure.value || null, lieu: ou || null } }, {

        await api('POST', { op: 'supprimer', table: 'contacts', id: c.id });

      });
    });
  });

function lireLead(form) {
  const el = form.elements;
  const v = {};
  for (const k of ['entreprise', 'type', 'statut', 'besoin', 'source', 'secteur', 'localisation', 'telephone', 'site_web', 'adresse', 'siret', 'hubspot_id', 'service', 'budget', 'raison_perte']) v[k] = el[k].value;
  v.valeur = el.valeur.value.trim() === '' ? null : el.valeur.value;
  v.tags = el.tags.value.split(',').map((t) => t.trim()).filter(Boolean);
  for (const k of ['formation_debut', 'formation_fin', 'financeur', 'financement_ref']) if (el[k]) v[k] = el[k].value.trim() || null;
  return v;
}

/* ----- Réglages ----- */

function telecharger(nom, contenu, type) {
  const url = URL.createObjectURL(new Blob([contenu], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exporterCsv(leads = D.leads, suffixe = 'leads') {
  const cellule = (v) => { const t = String(v ?? ''); return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const entete = ['Entreprise', 'Type', 'Étape', 'Prénom', 'Nom', 'Email', 'Téléphone', 'Poste', 'Besoin', 'Source', 'Valeur', 'Prochaine relance', 'Action', 'Ce qui est prévu', 'Relances sans réponse', 'Dernier contact', 'Archivé'];
  const lignes = leads.map((l) => {
    const c = contactPrincipal(l.id) || {};
    return [l.entreprise, LIB_TYPE[l.type], LIB_STATUT[l.statut], c.prenom, c.nom, c.email, c.telephone || l.telephone, c.poste, l.besoin, l.source, l.valeur, l.prochaine_relance, LIB_ACTION[l.prochaine_action], l.prochaine_note, l.relances_sans_reponse, l.dernier_contact, l.archive ? 'oui' : ''].map(cellule).join(';');
  });
  telecharger(`crm-${suffixe}-${aujourdhui()}.csv`, '﻿' + [entete.join(';'), ...lignes].join('\r\n'), 'text/csv;charset=utf-8');
}

/* ----- Étape, archive, suppression ----- */

function demanderRaisonPerte(l) {
  return new Promise((resoudre) => {
    let fini = false;
    ouvrirModale(`<h2>${esc(l.entreprise)} passe en perdu</h2>
      ${champ('Pourquoi ? (facultatif)', '<input type="text" name="raison" autofocus placeholder="Pas de budget cette année, a choisi un autre organisme…">')}
      <p class="aide">La relance prévue est supprimée.</p>
      ${piedFormulaire('<button type="submit" class="btn primaire">Passer en perdu</button>')}`, (form) => {
      brancherAnnuler(form);
      form.addEventListener('submit', (ev) => { ev.preventDefault(); fini = true; const r = form.elements.raison.value.trim(); fermerModale(); resoudre(r); });
      modale().addEventListener('close', () => { if (!fini) resoudre(null); }, { once: true });
    });
  });
}

// « Annuler » d'un toast : on retire la ligne d'historique et on remet les anciennes valeurs.
async function annulerAction(leadId, activite, valeurs) {
  try {
    if (activite) {
      await api('POST', { op: 'supprimer', table: 'activites', id: activite.id });
      D.activites = D.activites.filter((x) => x.id !== activite.id);
    }
    const r = await api('POST', { op: 'maj', table: 'leads', id: leadId, valeurs });
    remplacerLead(r.ligne);
    indexer(); rendre(); if (S.fiche) rendreFiche();
    toast('Annulé.');
  } catch (e) { toast(e.message); }
}

// La tâche qui suit chaque étape du suivi client.
function tacheSuivi(l, k, d = {}) {
  const debut = d.formation_debut || (l && l.formation_debut) || null;
  const fin = d.formation_fin || (l && l.formation_fin) || debut;
  const financeur = d.financeur || (l && l.financeur) || '';
  const ref = d.financement_ref || (l && l.financement_ref) || '';
  const t = aujourdhui();
  const tache = (jours, action, note, date = null) => ({ prochaine_relance: date || dansJours(jours), prochaine_action: action, prochaine_note: note });
  switch (k) {
    case 'a_lancer': return tache(1, 'autre', 'Monter le dossier de financement (OPCO, AGEFICE…) avec le client. Sans financement, passe directement à « Programme validé ».');
    case 'financement_demande': return tache(7, 'email', `Relancer ${financeur || 'le financeur'} pour l'accord de prise en charge${ref ? ` (dossier ${ref})` : ''}.`);
    case 'financement_accepte': return tache(1, 'email', 'Valider le programme avec le client.');
    case 'programme_valide': return tache(1, 'email', 'Placer les dates de formation avec le client et le formateur.');
    case 'dates_placees': return tache(1, 'email', 'Envoyer la convention de formation à signer.');
    case 'convention_signee': {
      const j7 = debut ? precedentOuvre(ajouterJours(debut, -7)) : null;
      return tache(7, 'email', "Envoyer les convocations, le livret d'accueil et le questionnaire de positionnement.", j7 ? (j7 > t ? j7 : t) : null);
    }
    case 'convocations': return tache(7, 'autre', 'Formation finie ? Récupérer les émargements et les évaluations, puis passer à « Formation terminée ».', fin && fin >= t ? dansJours(1, fin) : null);
    case 'formation_terminee': return tache(1, 'autre', 'Envoyer la facture avec les attestations et les émargements (au financeur ou au client).');
    case 'facturee': return tache(2, 'email', "Demander son avis sur la formation (« Demander un avis » sur la fiche, facultatif), puis proposer la suite. Le paiement se vérifie dans « Paiements » à l'échéance.");
    case 'payee': return tache(90, 'email', 'Évaluation à froid de la formation, et proposer la suite (niveau suivant).');
    default: return {};
  }
}
// « Gagné » fait entrer un prospect dans le suivi client ; quitter « Gagné » l'en sort.
function effetsStatut(l, maj) {
  if (!l || !maj || maj.statut === undefined || maj.statut === l.statut) return '';
  if (maj.statut === 'gagne' && !l.suivi && maj.suivi === undefined && ['prospect', 'client'].includes(maj.type || l.type)) {
    Object.assign(maj, { type: 'client', suivi: 'a_lancer', relances_sans_reponse: 0 });
    if (maj.prochaine_relance === undefined) Object.assign(maj, tacheSuivi(l, 'a_lancer'));
    return `${l.type === 'prospect' ? ', devient client' : ''} et passe dans le suivi client (À lancer)`;
  }
  if (maj.statut !== 'gagne' && l.suivi && maj.suivi === undefined) { maj.suivi = null; return ', sort du suivi client'; }
  return '';
}
const periodeFormation = (l) => (l.formation_debut ? `${dateCourte(l.formation_debut)}${l.formation_fin && l.formation_fin !== l.formation_debut ? ` au ${dateCourte(l.formation_fin)}` : ''}` : '');
// Certaines étapes demandent une info : le financeur, ou les dates. « Plus tard » passe sans.
function demanderDonneesSuivi(l, k) {
  const besoinFinanceur = ['financement_demande', 'financement_accepte'].includes(k) && !l.financeur;
  const besoinDates = ['dates_placees', 'convention_signee', 'convocations'].includes(k) && !l.formation_debut;
  if (!besoinFinanceur && !besoinDates) return Promise.resolve({});
  return new Promise((resoudre) => {
    let fini = false;
    ouvrirModale(`<h2>${esc(l.entreprise)} : ${esc(LIB_SUIVI[k])}</h2>
      ${besoinFinanceur ? `<div class="deux">${champ('Financeur', '<input type="text" name="financeur" autofocus placeholder="OPCO EP, AKTO, AGEFICE, le client…">')}${champ('N° de dossier', '<input type="text" name="financement_ref">')}</div>` : ''}
      ${besoinDates ? `<div class="deux">${champ('Premier jour', `<input type="date" name="formation_debut"${besoinFinanceur ? '' : ' autofocus'}>`)}${champ('Dernier jour', '<input type="date" name="formation_fin">')}</div><p class="aide">Les dates servent à prévoir les convocations (J-7) et la fin de formation.</p>` : ''}
      <div class="pied"><p class="erreur" data-erreur role="alert" hidden></p><button type="submit" class="btn primaire">Enregistrer</button><button type="button" class="btn" data-plus-tard>Plus tard</button><button type="button" class="btn" data-fermer>Annuler</button></div>`, (form) => {
      brancherAnnuler(form);
      $('[data-plus-tard]', form).addEventListener('click', () => { fini = true; fermerModale(); resoudre({}); });
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const el = form.elements;
        const d = {};
        for (const c of ['financeur', 'financement_ref', 'formation_debut', 'formation_fin']) if (el[c] && el[c].value.trim()) d[c] = el[c].value.trim();
        if (d.formation_debut && !d.formation_fin) d.formation_fin = d.formation_debut;
        if (d.formation_fin && d.formation_debut && d.formation_fin < d.formation_debut) return montrerErreur(form, 'Le dernier jour est avant le premier.', el.formation_fin);
        fini = true;
        fermerModale();
        resoudre(d);
      });
      modale().addEventListener('close', () => { if (!fini) resoudre(null); }, { once: true });
    });
  });
}
async function changerSuivi(leadId, k, { donnees = null, vocal = null } = {}) {
  const l = IDX.lead.get(leadId);
  if (!l || (k || null) === (l.suivi || null) || (k && !LIB_SUIVI[k])) return null;
  let d = donnees;
  if (k && !d) {
    d = await demanderDonneesSuivi(l, k);
    if (d === null) { rendre(); if (S.fiche) rendreFiche(); return null; }
  }
  d = d || {};
  const maj = { suivi: k || null, ...d };
  // Facturée ou payée à la main : la facture et le paiement suivent (bloc Paiements).
  if (k === 'facturee' && !l.facture_le) Object.assign(maj, { facture_le: aujourdhui(), facture_echeance: echeanceParDefaut({ ...l, ...d }) });
  if (k === 'payee' && !l.paye_le) Object.assign(maj, { paye_le: aujourdhui(), paiement_annonce: null });
  if (k) {
    Object.assign(maj, tacheSuivi(l, k, d), { relances_sans_reponse: 0 });
    if (l.statut !== 'gagne') maj.statut = 'gagne';
    if (l.type === 'prospect') maj.type = 'client';
  }
  const avant = Object.fromEntries(['suivi', 'statut', 'type', 'prochaine_relance', 'prochaine_action', 'prochaine_note', 'relances_sans_reponse', 'formation_debut', 'formation_fin', 'financeur', 'financement_ref'].map((x) => [x, l[x] ?? null]));
  const precisions = [d.formation_debut && `formation ${periodeFormation({ ...l, ...d })}`, d.financeur && `${d.financeur}${d.financement_ref ? `, dossier ${d.financement_ref}` : ''}`].filter(Boolean).join(' ; ');
  const resume = `Suivi client : ${l.suivi ? LIB_SUIVI[l.suivi] : 'hors suivi'}, puis ${k ? LIB_SUIVI[k] : 'hors suivi'}${precisions ? ` (${precisions})` : ''}`;
  try {
    const r = await journal(leadId, { type: 'statut', resume, source: 'crm', ...(vocal ? { meta: { vocal } } : {}) }, maj);
    toast(k ? `${LIB_SUIVI[k]}. Prochaine tâche : ${quand(maj.prochaine_relance)}.` : 'Sorti du suivi client.', 3500, () => annulerAction(leadId, r.activite, avant));
    return r;
  } catch (e) {
    toast(e.message);
    if (S.fiche) rendreFiche();
    return null;
  }
}

async function changerStatut(leadId, statut) {
  const l = IDX.lead.get(leadId);
  if (!l || statut === l.statut) return;
  const avant = l.statut;
  const maj = { statut };
  let resume = `Étape : ${LIB_STATUT[avant]}, puis ${LIB_STATUT[statut]}`;
  if (statut === 'perdu') {
    const raison = await demanderRaisonPerte(l);
    if (raison === null) { rendre(); if (S.fiche) rendreFiche(); return; }
    if (raison.trim()) { maj.raison_perte = raison.trim(); resume += ` : ${raison.trim()}`; }
    maj.prochaine_relance = null;
    maj.prochaine_note = null;
  }
  const remise = Object.fromEntries(['statut', 'type', 'suivi', 'prochaine_relance', 'prochaine_action', 'prochaine_note', 'relances_sans_reponse'].map((x) => [x, l[x] ?? null]));
  try {
    const r = await journal(leadId, { type: 'statut', resume, source: 'crm' }, maj);
    toast(statut === 'gagne' && IDX.lead.get(leadId)?.suivi === 'a_lancer' ? 'Gagné : il passe dans le suivi client, étape « À lancer ».' : `Étape : ${LIB_STATUT[statut]}.`, 3600, statut === 'perdu' || avant === 'perdu' ? null : () => annulerAction(leadId, r.activite, remise));
  } catch (e) {
    toast(e.message);
    rendreFiche();
  }
}

async function archiver(leadId) {
  const l = IDX.lead.get(leadId);
  try {
    const etaitArchive = l.archive;
    const r = await journal(leadId, { type: 'note', resume: etaitArchive ? 'Lead désarchivé' : 'Lead archivé', source: 'crm' }, { archive: !etaitArchive });
    toast(etaitArchive ? 'Lead désarchivé.' : 'Lead archivé.', 3200, () => annulerAction(leadId, r.activite, { archive: etaitArchive }));
  } catch (e) { toast(e.message); }
}

async function supprimerLead(leadId) {
  const l = IDX.lead.get(leadId);
  if (!confirm(`Supprimer définitivement ${l.entreprise}, ses contacts et tout son historique ?\nPour le garder sans le voir, choisis plutôt Archiver.`)) return;
  try {
    await api('POST', { op: 'supprimer', table: 'leads', id: leadId });
    D.leads = D.leads.filter((x) => x.id !== leadId);
    D.contacts = D.contacts.filter((x) => x.lead_id !== leadId);
    D.activites = D.activites.filter((x) => x.lead_id !== leadId);
    indexer(); $('#fiche').close(); rendre();
    toast('Lead supprimé.');
  } catch (e) { toast(e.message); }
}

async function supprimerActivite(id) {
  if (!confirm('Supprimer cette ligne de l\'historique ?')) return;
  try {
    await api('POST', { op: 'supprimer', table: 'activites', id });
    D.activites = D.activites.filter((x) => x.id !== id);
    indexer(); rendre(); rendreFiche();

}

/* ================= Vue Tableau (façon tableur) ================= */

const COLS = [
  { cle: 'entreprise', titre: 'Entreprise', src: 'lead', type: 'texte', fige: true },
  { cle: 'prenom', titre: 'Prénom', src: 'contact', type: 'texte' },
  { cle: 'nom', titre: 'Nom', src: 'contact', type: 'texte' },
  { cle: 'email', titre: 'Email', src: 'contact', type: 'email' },
  { cle: 'telephone', titre: 'Téléphone', src: 'contact', type: 'tel' },
  { cle: 'statut', titre: 'Étape', src: 'lead', type: 'choix', options: STATUTS },
  { cle: 'prochaine_relance', titre: 'Relance', src: 'lead', type: 'date' },
  { cle: 'prochaine_action', titre: 'Action', src: 'lead', type: 'choix', options: ACTIONS },
  { cle: 'prochaine_note', titre: 'Ce qui est prévu', src: 'lead', type: 'texte', large: true },
  { cle: 'relances_sans_reponse', titre: 'Sans réponse', src: 'lead', type: 'lecture' },
  { cle: 'dernier_contact', titre: 'Dernier contact', src: 'lead', type: 'date' },
  { cle: 'source', titre: 'Source', src: 'lead', type: 'texte' },
  { cle: 'type', titre: 'Type', src: 'lead', type: 'choix', options: TYPES },
  { cle: 'suivi', titre: 'Suivi client', src: 'lead', type: 'choix', options: SUIVIS },
  { cle: 'besoin', titre: 'Besoin', src: 'lead', type: 'texte', large: true },
  { cle: 'valeur', titre: 'Valeur (€ HT)', src: 'lead', type: 'nombre' },
  { cle: 'formation_debut', titre: 'Début formation', src: 'lead', type: 'date' },
  { cle: 'localisation', titre: 'Ville', src: 'lead', type: 'texte' },
  { cle: 'poste', titre: 'Poste', src: 'contact', type: 'texte' },
];
S.selection = new Set();
S.tri = { col: 'prochaine_relance', sens: 1 };
S.actif = null;          // { id, col } : la cellule active du tableau
S.derniereSelection = null;

function valeurCellule(l, c) {
  if (c.src === 'contact') {
    const ct = contactPrincipal(l.id);
    if (c.cle === 'telephone') { const j = contactJoignable(l.id); return (j && j.telephone) || l.telephone || ''; }
    return ct ? ct[c.cle] ?? '' : '';
  }
  return l[c.cle] ?? '';
}
function quandCourt(s) {
  const e = ecartJours(s);
  if (e === 0) return "aujourd'hui";
  if (e === 1) return 'demain';
  if (e < 0) return `en retard (${-e} j)`;
  const d = versDate(s);
  const an = d.getUTCFullYear() !== versDate(aujourdhui()).getUTCFullYear() ? ` ${d.getUTCFullYear()}` : '';
  const moisCourts = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  return `${JOURS[d.getUTCDay()].slice(0, 3)}. ${d.getUTCDate()} ${moisCourts[d.getUTCMonth()]}${an}`;
}
function celluleEntreprise(l) {
  return `<div class="ent">${avatar(l, 's')}<span class="nom-ent">${esc(l.entreprise)}</span><button type="button" class="ouvrir-fiche" data-act="ouvrir" tabindex="-1">Fiche</button></div>`;
}
function affichageCellule(l, c, v) {
  if (v === '' || v == null) return '';
  if (c.cle === 'statut') return `<span class="statut s-${esc(v)}">${esc(LIB_STATUT[v])}</span>`;
  if (c.cle === 'type') return esc(LIB_TYPE[v]);
  if (c.cle === 'suivi') return `<span class="statut s-suivi">${esc(LIB_SUIVI[v])}</span>`;
  if (c.cle === 'prochaine_action') return esc(LIB_ACTION[v]);
  if (c.cle === 'prochaine_relance') return `<span class="relance ${classeQuand(v)}" title="${esc(dateCourte(v))}">${esc(quandCourt(v))}</span>`;
  if (c.type === 'date') return esc(dateCourte(v));
  if (c.cle === 'valeur') return esc(euros(v));
  if (c.cle === 'relances_sans_reponse') return v ? esc(v) : '<span class="vide-cel">0</span>';
  if (c.cle === 'email') return `<span title="${esc(v)}">${esc(v)}</span>`;
  return esc(v);
}

function leadsDuTableau() {
  const f = S.filtres;
  const t = aujourdhui();
  const fin = ajouterJours(t, 7);
  const q = sansAccents(S.q.trim());
  let ls = D.leads.filter((l) => (f.archives ? true : !l.archive)
    && (!f.type || l.type === f.type) && (!f.statut || l.statut === f.statut) && (!f.source || l.source === f.source)
    && (!f.action || l.prochaine_action === f.action)
    && (!f.relance
      || (f.relance === 'retard' && l.prochaine_relance && l.prochaine_relance < t)
      || (f.relance === 'jour' && l.prochaine_relance && l.prochaine_relance <= t)
      || (f.relance === 'semaine' && l.prochaine_relance && l.prochaine_relance <= fin)
      || (f.relance === 'sans' && !l.prochaine_relance)));
  if (q) {
    ls = ls.filter((l) => {
      const c = contactsDe(l.id).map((x) => [nomContact(x), x.email, x.telephone, x.poste].join(' ')).join(' ');
      return sansAccents([l.entreprise, l.besoin, l.source, l.prochaine_note, l.localisation, l.secteur, (l.tags || []).join(' '), c].join(' ')).includes(q);
    });
  }
  const col = COLS.find((c) => c.cle === S.tri.col) || COLS[0];
  const cle = (l) => {
    const v = valeurCellule(l, col);
    if (v === '' || v == null) return null;
    return typeof v === 'number' ? v : sansAccents(v);
  };
  return ls.sort((a, b) => {
    const x = cle(a), y = cle(b);
    if (x === null && y === null) return a.entreprise.localeCompare(b.entreprise, 'fr');
    if (x === null) return 1;      // les cases vides toujours à la fin
    if (y === null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * S.tri.sens || a.entreprise.localeCompare(b.entreprise, 'fr');
  });
}

function ligneTableau(l) {
  const choisie = S.selection.has(l.id);
  return `<tr data-id="${l.id}" class="${choisie ? 'choisie' : ''}">
    <td class="c-sel"><input type="checkbox" data-sel aria-label="Sélectionner ${esc(l.entreprise)}" ${choisie ? 'checked' : ''}></td>
    ${COLS.map((c, j) => {
      const contenu = affichageCellule(l, c, valeurCellule(l, c));
      const classes = `c-${c.cle}${c.fige ? ' fige' : ''}${c.large ? ' large' : ''}${c.type === 'lecture' ? ' lecture' : ''}`;
      if (c.fige) return `<th scope="row" class="${classes}" data-col="${j}" tabindex="-1">${celluleEntreprise(l)}</th>`;
      return `<td class="${classes}" data-col="${j}" tabindex="-1">${contenu}</td>`;
    }).join('')}
  </tr>`;
}

function vueTableau() {
  const f = S.filtres;
  const ls = leadsDuTableau();
  S.lignesAffichees = ls.map((l) => l.id);
  const toutes = ls.length > 0 && ls.every((l) => S.selection.has(l.id));
  const opt = (liste, val, tous) => `<option value="">${tous}</option>` + liste.map(([k, v]) => `<option value="${esc(k)}" ${k === val ? 'selected' : ''}>${esc(v)}</option>`).join('');
  const n = S.selection.size;
  return `<div class="outils" style="margin-top:0"><h1 class="titre-vue">Tableau</h1><span class="espace"></span>
      <button type="button" class="btn petit" data-act="importer">Coller depuis Excel</button>
      <button type="button" class="btn petit" data-act="exporter-tableau">Exporter</button></div>
    <div class="outils">

function celluleTableau(id, col) { return $(`.tableur tr[data-id="${id}"] [data-col="${col}"]`); }
function activerCellule(cel, focus = true) {
  if (!cel) return;
  $$('.tableur [data-col][tabindex="0"]').forEach((x) => x.setAttribute('tabindex', '-1'));
  cel.setAttribute('tabindex', '0');
  S.actif = { id: cel.closest('tr').dataset.id, col: Number(cel.dataset.col) };
  if (focus) cel.focus({ preventScroll: false });
}
function restaurerCellule() {
  if (S.vue !== 'tableau' || !S.actif) return;
  const cel = celluleTableau(S.actif.id, S.actif.col);
  if (cel) activerCellule(cel, true);
}
function deplacerCellule(cel, dLigne, dCol) {
  const lignes = $$('.tableur tbody tr[data-id]');
  const i = lignes.indexOf(cel.closest('tr'));
  const j = Math.min(COLS.length - 1, Math.max(0, Number(cel.dataset.col) + dCol));
  const k = Math.min(lignes.length - 1, Math.max(0, i + dLigne));
  activerCellule($(`[data-col="${j}"]`, lignes[k]));
}

function editerCellule(cel, depart = null) {
  const c = COLS[Number(cel.dataset.col)];
  if (!c || c.type === 'lecture' || cel.classList.contains('edition')) return;
  const l = IDX.lead.get(cel.closest('tr').dataset.id);
  const avant = valeurCellule(l, c);
  let champ;
  if (c.type === 'choix') {
    champ = document.createElement('select');
    if (c.cle !== 'statut' && c.cle !== 'type' && c.cle !== 'prochaine_action') champ.add(new Option('', ''));
    for (const [k, v] of c.options) champ.add(new Option(v, k, false, k === avant));
  } else {
    champ = document.createElement('input');
    champ.type = c.type === 'date' ? 'date' : c.type === 'email' ? 'email' : c.type === 'tel' ? 'tel' : 'text';
    if (c.type === 'nombre') champ.inputMode = 'decimal';
    champ.value = depart !== null ? depart : String(avant ?? '');
  }
  champ.setAttribute('aria-label', c.titre);
  cel.classList.add('edition');
  cel.innerHTML = '';
  cel.appendChild(champ);
  champ.focus();
  if (champ.select && depart === null && champ.type === 'text') champ.select();
  let fini = false;
  const terminer = async (garder, dLigne = 0, dCol = 0) => {
    if (fini) return;
    fini = true;
    const nouvelle = champ.value.trim();
    cel.classList.remove('edition');
    if (!garder || nouvelle === String(avant ?? '').trim()) {
      cel.innerHTML = c.fige ? celluleEntreprise(l) : affichageCellule(l, c, avant);
      activerCellule(cel);
      if (dLigne || dCol) deplacerCellule(cel, dLigne, dCol);
      return;
    }
    S.actif = { id: l.id, col: Number(cel.dataset.col) };
    try {
      await enregistrerCellule(l, c, nouvelle);
      const cible = celluleTableau(l.id, Number(cel.dataset.col));
      if (cible) { cible.classList.add('enregistre'); activerCellule(cible); if (dLigne || dCol) deplacerCellule(cible, dLigne, dCol); }
    } catch (e) {
      toast(e.message || 'Pas enregistré.');
      rendre();
      restaurerCellule();
    }
  };
  champ.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); terminer(true, ev.shiftKey ? -1 : 1, 0); }
    else if (ev.key === 'Tab') { ev.preventDefault(); terminer(true, 0, ev.shiftKey ? -1 : 1); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); terminer(false); }
  });
  champ.addEventListener('blur', () => terminer(true));
  if (c.type === 'choix') champ.addEventListener('change', () => champ.blur());
}

async function enregistrerCellule(l, c, v) {
  if (c.src === 'contact') {
    if (c.cle === 'email' && v && !/^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/.test(v)) throw new ErreurApi('Adresse email invalide.');
    const ct = contactPrincipal(l.id);
    if (ct) {
      const r = await api('POST', { op: 'maj', table: 'contacts', id: ct.id, valeurs: { [c.cle]: v } });
      Object.assign(ct, r.ligne);
    } else {
      const r = await api('POST', { op: 'creer', table: 'contacts', valeurs: { lead_id: l.id, [c.cle]: v, principal: true } });
      D.contacts.push(r.ligne);
    }
    indexer(); rendre(); restaurerCellule();
    return;
  }
  if (c.cle === 'entreprise' && !v) throw new ErreurApi("Le nom de l'entreprise ne peut pas être vide.");
  if (c.cle === 'statut') { await changerStatut(l.id, v); restaurerCellule(); return; }
  if (c.cle === 'suivi') { await changerSuivi(l.id, v || null); restaurerCellule(); return; }
  if (c.cle === 'prochaine_relance' || c.cle === 'prochaine_action') {
    const p = { prochaine_relance: l.prochaine_relance, prochaine_action: l.prochaine_action, [c.cle]: v || null };
    if (!p.prochaine_action) p.prochaine_action = 'email';
    await journal(l.id, { type: 'relance_decalee', resume: p.prochaine_relance ? `Relance prévue le ${dateLongue(p.prochaine_relance)} (${actionLue(p.prochaine_action).toLowerCase()}), depuis le tableau` : 'Plus de relance prévue, depuis le tableau', source: 'crm' }, { [c.cle]: v || (c.cle === 'prochaine_action' ? 'email' : null) });
    restaurerCellule();
    return;
  }
  const valeur = c.type === 'nombre' ? (v === '' ? null : v) : v;
  const r = await api('POST', { op: 'maj', table: 'leads', id: l.id, valeurs: { [c.cle]: valeur } });
  remplacerLead(r.ligne);
  if (c.cle === 'source' && v) S.derniereSource = v;
  indexer(); rendre(); restaurerCellule();
}

async function ajoutRapide(input) {
  const nom = input.value.trim();
  if (!nom) return;
  if (D.leads.some((l) => sansAccents(l.entreprise) === sansAccents(nom)) && !confirm(`« ${nom} » existe déjà. Créer une deuxième ligne quand même ?`)) return;
  input.disabled = true;
  try {
    const r = await api('POST', { op: 'creer', table: 'leads', valeurs: { entreprise: nom, source: S.derniereSource || null, prochaine_relance: dansJours(1), prochaine_action: 'email' } });
    D.leads.push(r.ligne);
    indexer();
    S.actif = { id: r.ligne.id, col: 1 };
    rendre();
    restaurerCellule();
    toast(`${nom} ajouté. Complète la ligne, puis Entrée.`);
  } catch (e) {
    toast(e.message);
    input.disabled = false;
  }
}

    const adresses = [...new Set(ids.flatMap((id) => contactsDe(id).map((c) => c.email)).filter(Boolean))];
    const sans = ids.filter((id) => !contactsDe(id).some((c) => c.email)).length;

    navigator.clipboard.writeText(adresses.join(', ')).then(() => toast(`${adresses.length} adresse${adresses.length > 1 ? 's' : ''} copiée${adresses.length > 1 ? 's' : ''}${sans ? `, ${sans} lead${sans > 1 ? 's' : ''} sans email` : ''}.`), () => toast('Copie impossible dans ce navigateur.'));

      ${piedFormulaire('<button type="submit" class="btn primaire">Appliquer</button>')}`, (form) => {
      brancherAnnuler(form);
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        soumettre(form, async () => {
          const v = form.elements.valeur.value;
          if (sorte === 'etape') {
            const maj = { statut: v };
            if (v === 'perdu') { maj.prochaine_relance = null; maj.prochaine_note = null; }
            if (v !== 'gagne') maj.suivi = null;
            const entrent = v === 'gagne' ? ids.filter((id) => { const x = IDX.lead.get(id); return x && x.statut !== 'gagne' && !x.suivi && ['prospect', 'client'].includes(x.type); }) : [];

          } else {
            await lot(ids, { prochaine_action: v }, null, `Action : ${LIB_ACTION[v]} pour ${n} lead${n > 1 ? 's' : ''}.`);
          }
          fermerModale();
        });
      });

  }
  if (sorte === 'decaler') {
    ouvrirModale(`<h2>Décaler la relance de ${n} lead${n > 1 ? 's' : ''}</h2>

        soumettre(form, async () => {

          const texte = p.prochaine_relance ? `Relance déplacée au ${dateLongue(p.prochaine_relance)} (${actionLue(p.prochaine_action).toLowerCase()}), modification groupée` : 'Plus de relance prévue (modification groupée)';
          await lot(ids, p, { type: 'relance_decalee', resume: texte, source: 'crm' }, `${n} relance${n > 1 ? 's' : ''} décalée${n > 1 ? 's' : ''}.`);
          fermerModale();
        });

    });
  }

];
const STATUT_DEPUIS_TEXTE = Object.fromEntries(STATUTS.flatMap(([k, v]) => [[sansAccents(v), k], [k, k]]));

function lireTableauColle(texte) {
  const lignesBrutes = texte.replace(/\r\n?/g, '\n').split('\n').filter((l) => l.trim());
  if (lignesBrutes.length < 2) return null;
  const premiere = lignesBrutes[0];
  const sep = premiere.includes('\t') ? '\t' : (premiere.split(';').length >= premiere.split(',').length ? ';' : ',');
  const decouper = (ligne) => {
    if (sep === '\t') return ligne.split('\t').map((x) => x.trim());
    const cases = []; let cur = ''; let guillemets = false;
    for (let i = 0; i < ligne.length; i++) {
      const ch = ligne[i];
      if (ch === '"') { if (guillemets && ligne[i + 1] === '"') { cur += '"'; i++; } else guillemets = !guillemets; }
      else if (ch === sep && !guillemets) { cases.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cases.push(cur.trim());
    return cases;
  };
  const entetes = decouper(premiere.replace(/^﻿/, ''));
  const carte = entetes.map((h) => {
    const n = sansAccents(h).replace(/\s+/g, ' ').trim();
    const trouve = ENTETES.find(([, noms]) => noms.includes(n));
    return trouve ? trouve[0] : null;
  });
  // « Nom » seul vaut nom du contact, sauf s'il n'y a aucune colonne Entreprise.
  if (!carte.includes('entreprise')) {
    const i = carte.indexOf('nom');
    if (i >= 0 && !carte.includes('prenom')) carte[i] = 'entreprise';
  }
  const lignes = lignesBrutes.slice(1).map(decouper).map((cases) => Object.fromEntries(carte.map((k, i) => [k, cases[i] || '']).filter(([k, v]) => k && v)));
  return { entetes, carte, lignes };
}

            besoin: x.besoin, localisation: x.localisation, secteur: x.secteur, site_web: x.site_web, siret: x.siret, adresse: x.adresse,
            telephone: x.tel_entreprise, valeur: x.valeur ? x.valeur.replace(/[^\d,.-]/g, '') || null : null,
            prochaine_relance: jour, prochaine_action: el.action.value, tags: ['import tableau'] };
          const aContact = x.prenom || x.nom || x.email || x.telephone;
          const tel = x.telephone && /^[1-9]\d{8}$/.test(x.telephone.replace(/\s/g, '')) ? `0${x.telephone.replace(/\s/g, '')}` : x.telephone;
          return { lead, contact: aContact ? { id: crypto.randomUUID(), prenom: x.prenom, nom: x.entreprise ? x.nom : null, email: x.email, telephone: tel, poste: x.poste, principal: true } : null };
        });
        const r = await api('POST', { op: 'importer', lignes: envoi });
        D.leads.push(...r.leads); D.contacts.push(...r.contacts); r.activites.forEach(ajouterActivite);
        indexer(); fermerModale();
        S.filtres.source = ''; rendre();
        toast(`${r.leads.length} lead${r.leads.length > 1 ? 's' : ''} importé${r.leads.length > 1 ? 's' : ''}.`, 5000);
      });
    });
  });
}

const GSM = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà^{}\\[~]|€';
function compteSms(t) {
  const car = [...t];
  const gsm = car.every((x) => GSM.includes(x));
  const par = gsm ? (car.length <= 160 ? 160 : 153) : (car.length <= 70 ? 70 : 67);
  return { n: car.length, sms: Math.max(1, Math.ceil(car.length / par)), gsm };
}
// 06 12 34 56 78 donne 33612345678 ; 0692… (La Réunion) donne 262692…
function numeroInternational(t) {
  const d = String(t || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (/^0(262|263|269|639|692|693)\d{6}$/.test(d)) return `262${d.slice(1)}`;
  if (/^0\d{9}$/.test(d)) return `33${d.slice(1)}`;
  return d;
}
const lienSms = (tel, texte) => `sms:+${numeroInternational(tel)}?&body=${encodeURIComponent(texte)}`;
const lienWhatsapp = (tel, texte) => `https://wa.me/${numeroInternational(tel)}?text=${encodeURIComponent(texte)}`;

    <div class="actions">

      <a class="btn" data-lien="wa" href="#" target="_blank" rel="noopener">Ouvrir dans WhatsApp</a>
    </div>

    ${blocProchaine('apres', dansJours(delaiApres(n)), l.prochaine_action === 'appel' ? 'appel' : 'email', n <= CADENCE.length ? `Relance ${n}` : 'Prise de nouvelles', { aide: 'Proposé d\'après le rythme des relances.' })}

    for (const a of $$('[data-lien]', form)) {

        const reste = el.texte.value.match(/\{[a-z_]+\}/);
        if (reste) { ev.preventDefault(); montrerErreur(form, `Il reste ${reste[0]} à remplacer par ton texte.`); return; }
        canal = a.dataset.lien === 'wa' ? 'whatsapp' : 'sms';
        setTimeout(() => { const conf = $('[data-confirmation]', form); conf.hidden = false; conf.scrollIntoView({ block: 'nearest' }); }, 400);
      });
    }
    $('[data-pas-encore]', form).addEventListener('click', () => { $('[data-confirmation]', form).hidden = true; });
    for (const b of $$('[data-noter]', form)) {
      b.addEventListener('click', () => soumettre(form, async () => {
        const x = choisi();
        if (el.garder && el.garder.checked && el.modele) S.session.modeleSms = el.modele.value || null;
        const m = { ...lireProchaine(form, 'apres'), relances_sans_reponse: n, dernier_contact: aujourdhui() };
        if (l.statut === 'nouveau') m.statut = 'contacte';
        await journal(l.id, { type: 'sms', resume: `${canal === 'whatsapp' ? 'Message WhatsApp' : 'SMS'} envoyé au ${x.tel}`, contenu: el.texte.value, contact_id: x.id || null, source: 'crm', meta: { canal } }, m);
        fermerModale();
        toast(canal === 'whatsapp' ? 'WhatsApp noté.' : 'SMS noté.');
        actionFaite(l.id, 'sms');
      }));
    }
  });
}

/* ================= Pipeline : glisser une carte vers une autre étape ================= */

document.addEventListener('dragstart', (ev) => {
  const carteGlissee = ev.target.closest && ev.target.closest('.kanban .carte');
  if (!carteGlissee) return;
  ev.dataTransfer.setData('text/plain', carteGlissee.dataset.id);
  ev.dataTransfer.effectAllowed = 'move';
  carteGlissee.classList.add('glisse');
});
document.addEventListener('dragend', (ev) => { if (ev.target.classList) ev.target.classList.remove('glisse'); $$('.colonne.survol').forEach((c) => c.classList.remove('survol')); });
document.addEventListener('dragover', (ev) => {
  const col = ev.target.closest && ev.target.closest('.kanban .colonne');
  if (!col) return;
  ev.preventDefault();
  $$('.colonne.survol').forEach((c) => c !== col && c.classList.remove('survol'));
  col.classList.add('survol');
});
document.addEventListener('drop', (ev) => {
  const col = ev.target.closest && ev.target.closest('.kanban .colonne');
  if (!col) return;
  ev.preventDefault();
  col.classList.remove('survol');
  const id = ev.dataTransfer.getData('text/plain');
  if (id && IDX.lead.has(id)) { if (col.dataset.suivi) changerSuivi(id, col.dataset.suivi); else changerStatut(id, col.dataset.statut); }
});

/* ================= Événements ================= */

document.addEventListener('click', (ev) => {
  const cible = ev.target.closest('[data-act]');
  if (!cible) return;
  const act = cible.dataset.act;
  if (act === 'tel') {
    // Le lien tel: lance l'appel ; au retour sur la page, on propose de le noter.
    const zone = cible.closest('[data-id]');
    S.appel = { id: (zone && zone.dataset.id) || S.fiche, t: Date.now() };
    return;
  }
  const conteneur = cible.closest('[data-id]');
  const leadId = (conteneur && conteneur.dataset.id) || S.fiche;
  if (cible.tagName === 'BUTTON' || act !== 'ouvrir') ev.stopPropagation();
  switch (act) {
    case 'ouvrir': S.journalEdition = false; return ouvrirFiche(leadId);
    case 'echanges': return ouvrirEchanges(leadId, cible.dataset.fil || null);
    case 'formateur-nouveau': return ouvrirNouveauFormateur();
    case 'programme-generer': return ouvrirGenererProgramme(IDX.lead.get(leadId));
    case 'programme-ouvrir': return ouvrirProgramme(cible.dataset.programme, { reco: cible.dataset.reco === '1' });
    case 'formateur-lien': { const l = IDX.lead.get(leadId); return opFormateur({ op: 'formateur_lien', lead_id: leadId }).then((r) => { if (r && r.jeton) ouvrirLienFormateur(l, r); }); }
    case 'formateur-profil': return ouvrirProfilFormateur(IDX.lead.get(leadId));
    case 'formateur-valider': return ouvrirValiderFormateur(IDX.lead.get(leadId));
    case 'formateur-siret': return opFormateur({ op: 'formateur_siret', lead_id: leadId }, 'SIRET revérifié.');
    case 'formateur-refuser': { const f = dossierDe(leadId); if (f.statut !== 'refuse' && !confirm('Refuser ce formateur ? Son lien d\'envoi ne fonctionnera plus.')) return; return opFormateur({ op: 'formateur_refuser', lead_id: leadId, annuler: f.statut === 'refuse' }, f.statut === 'refuse' ? 'Dossier rouvert.' : 'Formateur refusé.'); }
    case 'piece-deposer': return ouvrirDepotPiece(IDX.lead.get(leadId));
    case 'contrat-voir': return ouvrirContratSigne(IDX.lead.get(leadId));
    case 'piece-voir': return voirPiece(cible.closest('[data-doc]').dataset.doc);
    case 'piece-ok': return opFormateur({ op: 'document_verifier', id: cible.closest('[data-doc]').dataset.doc, statut: 'verifie' }, 'Pièce vérifiée.');
    case 'piece-refaire': return ouvrirMotifPiece(cible.closest('[data-doc]').dataset.doc);
    case 'recap': return faireRecap(leadId);
    case 'fermer-fiche': return $('#fiche').close();
    case 'email': return ouvrirEmail(leadId, cible.dataset.contact);
    case 'appel': return ouvrirAppel(leadId);
    case 'perdu': return changerStatut(leadId, 'perdu').then(() => { if (IDX.lead.get(leadId)?.statut === 'perdu') actionFaite(leadId, 'perdu'); });
    case 'suivi-suivant': { const l = IDX.lead.get(leadId); const k = l && suivantDe(l.suivi); if (!k) return; return changerSuivi(leadId, k).then((r) => { if (r) actionFaite(leadId, 'suivi'); }); }
    case 'linkedin': return ouvrirLinkedin(leadId);
    case 'sms': return ouvrirSms(leadId);
    case 'journal-edition': S.journalEdition = !S.journalEdition; return rendreFiche();
    case 'creer-depuis-recherche': { const nom = S.q.trim(); ouvrirNouveau(); const champNom = $('#modale input[name="entreprise"]'); if (champNom) champNom.value = nom; return; }
    case 'importer': return ouvrirImport();
    case 'exporter-tableau': return exporterCsv(leadsDuTableau(), 'tableau');
    case 'decaler': return ouvrirDecaler(leadId);
    case 'rdv': return ouvrirRdv(leadId);
    case 'note': return ouvrirNote(leadId, 'note');
    case 'reponse': return ouvrirNote(leadId, 'email_recu');
    case 'contact-nouveau': return ouvrirContact(S.fiche);
    case 'contact-modifier': return ouvrirContact(S.fiche, cible.dataset.contact);
    case 'infos': return ouvrirInfos(S.fiche);
    case 'archiver': return archiver(S.fiche);
    case 'supprimer-lead': return supprimerLead(S.fiche);
    case 'suppr-activite': return supprimerActivite(cible.dataset.activite);
    case 'memo-nouveau': return ouvrirMemo(null);
    case 'memo-modifier': return ouvrirMemo(cible.dataset.memo);
    case 'modele-nouveau': return ouvrirModele(null);
    case 'modele-modifier': return ouvrirModele(cible.dataset.modele);
    case 'voir-memo': {
      $('#q').value = ''; S.q = ''; S.vue = 'memo'; rendre();
      const cibleMemo = cible.dataset.memo === 'modeles' ? $('#memo-modeles') : $(`#memo-${cible.dataset.memo}`);
      if (cibleMemo) { if (cibleMemo.tagName === 'DETAILS') cibleMemo.open = true; cibleMemo.scrollIntoView({ block: 'start' }); }
      return;
    }
    default:
  }
});

document.addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
  const libre = !ev.target.matches('input, textarea, select, [data-col]') && !$('#modale').open && !$('#fiche').open && !$('#session').open && !ev.metaKey && !ev.ctrlKey;
  if (ev.key === '/' && libre) { ev.preventDefault(); $('#q').focus(); }
  if (ev.key === 'n' && libre) { ev.preventDefault(); ouvrirNouveau(); }
});

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pipeline], [data-type-pipeline]');
  if (!b) return;
  if (b.dataset.pipeline) { S.pipeline = b.dataset.pipeline; localStorage.setItem('crm_pipeline', S.pipeline); }
  else S.typePipeline = b.dataset.typePipeline;
  rendre();
});

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-enchainer]');
  if (!b || !S.dusDuJour) return;
  const titres = { tout: 'Relances du jour', email: 'Emails du jour', appel: 'Appels du jour', autre: 'Le reste du jour' };
  const vocal = b.hasAttribute('data-a-la-voix');
  if (vocal) deverrouillerAudio();
  demarrerSession(S.dusDuJour[b.dataset.enchainer] || [], vocal ? 'Relances du jour, à la voix' : titres[b.dataset.enchainer], { vocal });
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'statut-fiche') return changerStatut(t.dataset.lead, t.value);
  if (t.id === 'suivi-fiche') return changerSuivi(t.dataset.lead, t.value || null);
  if (t.dataset.filtre) {
    S.filtres[t.dataset.filtre] = t.type === 'checkbox' ? t.checked : t.value;
    rendre();
  }
});

$$('.onglets button').forEach((b) => b.addEventListener('click', () => {
  S.vue = b.dataset.vue;
  S.q = ''; $('#q').value = '';
  rendre();
  window.scrollTo(0, 0);
}));

let minuteurRecherche;
$('#q').addEventListener('input', (ev) => {
  clearTimeout(minuteurRecherche);
  minuteurRecherche = setTimeout(() => { S.q = ev.target.value.trim().length >= 2 ? ev.target.value : ''; rendre(); }, 150);
});
$('#btn-nouveau').addEventListener('click', ouvrirNouveau);
$('#btn-reglages').addEventListener('click', ouvrirReglages);
$('#fiche').addEventListener('close', () => { S.fiche = null; });
// Un clic sur le voile ferme le panneau ou la fenêtre.
for (const d of [$('#fiche'), $('#modale')]) {
  d.addEventListener('click', (ev) => { if (ev.target === d) d.close(); });
}

/* Claude peut aussi écrire dans la base (relances préparées depuis Claude
   Code) : on relit en revenant sur l'onglet après 3 minutes. */
async function actualiser() {
  await charger();
  rendre();
  if (S.fiche) rendreFiche();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !D) return;
  if (S.appel && Date.now() - S.appel.t > 4000 && !$('#modale').open && IDX.lead.has(S.appel.id)) {
    const id = S.appel.id;
    S.appel = null;
    ouvrirAppel(id);
    return;
  }
  // Pas d'actualisation pendant une saisie ou une sélection dans le tableau.
  const occupe = $('#modale').open || $('.tableur .edition') || (S.vue === 'tableau' && S.selection.size);
  if (Date.now() - S.chargeA > 180000 && !occupe) actualiser().catch(() => {});
});

/* ================= Connexion ================= */

function deconnecter(message) {
  localStorage.removeItem('crm_cle');
  sessionStorage.removeItem('crm_cle');
  S.cle = '';
  D = null;
  for (const d of [$('#fiche'), $('#modale')]) if (d.open) d.close();
  $('#app').hidden = true;
  $('#ecran-cle').hidden = false;
  const e = $('#erreur-cle');
  e.textContent = message || '';
  e.hidden = !message;
  $('#cle').value = '';
  $('#cle').focus();
}

async function demarrer() {
  $('#ecran-cle').hidden = true;
  $('#app').hidden = false;
  try {
    await charger();
    rendre();
    reprendreSessionSauvee();
    synchroDiscrete();
  } catch (e) {
    if (S.cle) $('#vue').innerHTML = `<p class="chargement">${esc(e.message)} <button type="button" class="btn petit" onclick="location.reload()">Réessayer</button></p>`;
  }
}

$('#form-cle').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const cle = $('#cle').value.trim();
  if (!cle) return;
  S.cle = cle;
  const bouton = $('#form-cle button');
  bouton.disabled = true;
  try {
    await charger();
    (($('#retenir').checked) ? localStorage : sessionStorage).setItem('crm_cle', cle);
    $('#ecran-cle').hidden = true;
    $('#app').hidden = false;
    rendre();
  } catch (e) {
    const err = $('#erreur-cle');
    err.textContent = e.message;
    err.hidden = false;
  } finally {
    bouton.disabled = false;
  }
});

if (S.cle) demarrer(); else deconnecter('');
</script>
