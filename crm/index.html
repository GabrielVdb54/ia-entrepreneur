<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM de Gabriel</title>
<!-- Outil privé : jamais dans Google, jamais dans le sitemap, lié nulle part. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F8FD;
    --card: #FFFFFF;
    --text: #0A0F2C;
    --muted: #525880;
    --line: #E3E7F5;
    --line-strong: #C9D0EA;
    --primary: #1A3CFF;
    --primary-dark: #1532D6;
    --primary-soft: #EEF1FF;
    --accent: #10B981;
    --accent-dark: #0E7A57;
    --accent-soft: #E7F8F1;
    --danger: #B42318;
    --danger-soft: #FDECEA;
    --warn: #B54708;
    --warn-soft: #FEF0C7;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea { font-size: 16px; }
  [hidden] { display: none !important; }
  a { color: var(--primary); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card);
    font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--text);
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); }
  .btn.primaire { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primaire:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--danger); }
  .btn.lien { border-color: transparent; background: none; color: var(--primary); padding-left: 6px; padding-right: 6px; }
  #btn-nouveau { gap: .28em; }
  .btn.petit { min-height: 34px; padding: 5px 10px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Écran de la clé */
  .accueil { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .accueil form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .accueil h1 { font-size: 22px; font-weight: 800; }
  .accueil p { color: var(--muted); font-size: 14px; }
  .case { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .case input { width: 18px; height: 18px; }
  .erreur { color: var(--danger); font-size: 14px; }

  /* Barre du haut */
  .barre { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, .97); border-bottom: 1px solid var(--line); }
  .barre-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .marque { font-weight: 800; font-size: 17px; white-space: nowrap; }
  .marque span { color: var(--primary); }
  .recherche { flex: 1; min-width: 0; }
  .recherche input { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--bg); }
  .onglets { max-width: 1280px; margin: 0 auto; display: flex; gap: 4px; padding: 0 12px; }
  .onglets button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .onglets button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .compteur { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; line-height: 20px; text-align: center; margin-left: 4px; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 96px; }

  .titre-vue { font-size: 22px; font-weight: 800; line-height: 1.25; }
  .sous-titre { color: var(--muted); margin: 2px 0 6px; }
  .resume-jour { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .chiffre { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; color: var(--muted); }
  .chiffre b { color: var(--text); font-size: 16px; margin-right: 4px; }
  .chiffre.alerte-chiffre b { color: var(--danger); }
  .groupe { margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; color: var(--text); }
  .groupe span { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
  .groupe.retard span { color: var(--danger); border-color: #F4C7C2; }
  .groupe.retard { color: var(--danger); }
  .vide { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .grille { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }

  /* Carte d'un lead */
  .carte { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .carte:hover { border-color: var(--line-strong); }
  .carte-haut { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .carte h3 { font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .statut { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .statut.s-proposition, .statut.s-negociation { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
  .statut.s-gagne { background: var(--accent-soft); color: var(--accent-dark); border-color: transparent; }
  .meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .relance { font-size: 14px; font-weight: 700; }
  .relance.retard { color: var(--danger); }
  .relance.jour { color: var(--warn); }
  .extrait { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .carte-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  /* Pipeline */
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; margin-top: 14px; }
  .colonne { scroll-snap-align: start; background: #EEF0F8; border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; }
  .colonne > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; font-size: 14px; padding: 2px 4px 4px; }
  .colonne > header small { color: var(--muted); font-weight: 600; }
  .colonne .carte { padding: 10px 12px; }

  /* Tous les leads */
  .filtres { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 12px; align-items: center; }
  .filtres select { height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--card); font-size: 14px; max-width: 100%; }
  .tableau { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .rangee { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: center; cursor: pointer; font-size: 14px; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .rangee:first-child { border-top: 0; }
  .rangee:hover { background: #FAFBFF; }
  .rangee.entete { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; cursor: default; background: var(--bg); letter-spacing: .03em; }
  .rangee > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rangee b { font-weight: 700; }

  /* Résultats de recherche */
  .trouve { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; margin-bottom: 8px; }
  .trouve:hover { border-color: var(--line-strong); }
  .trouve h3 { font-size: 15px; }
  .trouve ul { list-style: none; margin-top: 4px; }
  .trouve li { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  mark { background: #FFF2B3; color: inherit; border-radius: 3px; padding: 0 1px; }

  /* Mémo */
  .memo-cat { margin-top: 22px; }
  .memo { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }
  .memo summary { padding: 12px 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .memo summary::-webkit-details-marker { display: none; }
  .memo summary::after { content: '+'; color: var(--muted); font-weight: 600; }
  .memo[open] summary::after { content: '\2013'; }
  .memo .corps { padding: 0 14px 14px; font-size: 14px; }
  .md p, .md ul, .md ol { margin: 6px 0; }
  .md ul, .md ol { padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md h4 { margin: 12px 0 4px; font-size: 14px; }
  .md pre { white-space: pre-wrap; font-family: inherit; background: var(--bg); border-radius: 8px; padding: 10px; }
  .petites-sources { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Panneaux et fenêtres */
  dialog { border: 0; padding: 0; background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(10, 15, 44, .45); }
  dialog.panneau { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(660px, 100vw); max-width: 100vw; overscroll-behavior: contain; }
  dialog.modale { width: min(580px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border-radius: 16px; margin: auto; overscroll-behavior: contain; }
  .fiche-tete { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; z-index: 2; }
  .fiche-tete h2 { font-size: 20px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
  .surtitre { font-size: 13px; font-weight: 600; color: var(--muted); }
  .fermer { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; flex: none; }
  .bloc { padding: 16px; border-bottom: 1px solid var(--line); }
  .bloc > h3 { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ligne-statut { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ligne-statut select { height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--card); font-weight: 600; }
  .prochaine { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  .prochaine .valeur { font-weight: 700; font-size: 16px; }
  .prochaine .valeur.retard { color: var(--danger); }
  .prochaine .valeur.jour { color: var(--warn); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  dl.infos { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 12px; font-size: 15px; }
  dl.infos dt { color: var(--muted); }
  dl.infos dd { overflow-wrap: anywhere; white-space: pre-wrap; }
  .contact { padding: 10px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .contact:first-of-type { border-top: 0; padding-top: 0; }
  .contact .nom { font-weight: 700; }
  .contact .liens { display: flex; flex-direction: column; gap: 2px; font-size: 14px; overflow-wrap: anywhere; }
  .contact-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .journal { list-style: none; }
  .journal li { padding: 0 0 14px 16px; border-left: 2px solid var(--line); position: relative; }
  .journal li:last-child { padding-bottom: 0; }
  .journal li::before { content: ''; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--line-strong); }
  .journal li.t-email_envoye::before, .journal li.t-brouillon::before { border-color: var(--primary); }
  .journal li.t-email_recu::before, .journal li.t-appel::before, .journal li.t-rdv::before { border-color: var(--accent); background: var(--accent); }
  .journal .quand { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .journal .quoi { font-weight: 700; font-size: 13px; color: var(--text); }
  .journal .resume { font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .journal details { margin-top: 4px; }
  .journal summary { cursor: pointer; color: var(--primary); font-size: 13px; }
  .journal pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; background: var(--bg); padding: 10px; border-radius: 8px; margin-top: 6px; overflow-wrap: anywhere; }
  .source { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .suppr-journal { border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; margin-left: auto; }
  .fiche-pied { padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* Formulaires */
  .form { padding: 18px 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .form > h2 { font-size: 19px; font-weight: 800; line-height: 1.3; }
  .champ { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
  .champ input, .champ select, .champ textarea { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--card); color: var(--text); font-weight: 400; width: 100%; }
  .champ textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  .champ textarea.grand { min-height: 260px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .puces { display: flex; flex-wrap: wrap; gap: 6px; }
  .puces button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .puces button[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .pied { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--card); padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 4px; }
  .aide { font-size: 13px; color: var(--muted); font-weight: 400; }
  .alerte { background: var(--warn-soft); color: #7A2E0E; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .confirmation { background: var(--primary-soft); border-radius: 10px; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
  .confirmation .actions { justify-content: flex-end; }
  .de { font-size: 13px; color: var(--muted); }
  .de b { color: var(--text); }
  fieldset { border: 0; display: flex; flex-direction: column; gap: 6px; }
  legend { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }

  #toast { position: fixed; inset: auto auto 24px 50%; margin: 0; border: 0; overflow: visible; width: max-content; height: auto; transform: translateX(-50%); background: var(--text); color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; max-width: calc(100vw - 32px); text-align: center; }
  #toast.visible { opacity: 1; }
  .chargement { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Images : logos des entreprises (ou initiales), portrait, photo d'accueil */
  .avatar { --h: 225; flex: none; display: inline-grid; place-items: center; border-radius: 10px; background: hsl(var(--h) 70% 95%); color: hsl(var(--h) 45% 30%); border: 1px solid hsl(var(--h) 35% 88%); font-weight: 800; overflow: hidden; line-height: 1; letter-spacing: .02em; }
  .avatar img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 3px; }
  .a-s { width: 26px; height: 26px; font-size: 10.5px; border-radius: 7px; }
  .a-m { width: 42px; height: 42px; font-size: 14px; }
  .a-l { width: 58px; height: 58px; font-size: 19px; border-radius: 14px; }
  .a-rond { border-radius: 50%; }
  .photo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; }
  .marque { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
  .marque img { height: 24px; width: auto; display: block; }
  .marque span { font-weight: 800; font-size: 15px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 8px; }
  #btn-reglages { padding-left: 6px; }
  .salut { display: flex; align-items: center; gap: 14px; }
  .salut img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .salut .meta { font-size: 15px; }
  .accueil form { padding: 0; overflow: hidden; }
  .accueil .couverture { display: block; width: 100%; height: 150px; object-fit: cover; }
  .accueil .dedans { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 14px; }
  .accueil .portrait { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; margin-top: -36px; object-fit: cover; box-shadow: 0 1px 0 var(--line); }
  .accueil .logo { height: 22px; width: auto; align-self: flex-start; }
  .tete-ent { display: flex; gap: 14px; align-items: center; min-width: 0; }
  .tete-ent > div { min-width: 0; }
  .carte-haut { display: flex; gap: 12px; align-items: flex-start; }
  .carte-titre { flex: 1; min-width: 0; }
  .contact { align-items: center; }
  .contact .qui { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }

  /* Étapes : une couleur douce chacune, pour lire le pipeline d'un coup d'œil */
  .statut.s-contacte { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
  .statut.s-qualifie { background: #E3F4F6; color: #0C6470; border-color: transparent; }
  .statut.s-proposition { background: #FEF1DC; color: #874A08; border-color: transparent; }
  .statut.s-negociation { background: #FCE8DA; color: #93390B; border-color: transparent; }
  .statut.s-perdu { background: #F2F3F6; color: #6B7085; border-color: transparent; }
  .statut.s-suivi { background: var(--accent-soft); color: var(--accent-dark); border-color: transparent; }
  .segments { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: #EEF0F8; margin: 10px 0 4px; }
  .segments button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; min-height: 36px; }
  .segments button[aria-selected="true"] { background: #fff; color: var(--ink, #14172B); box-shadow: 0 1px 2px rgb(20 23 43 / 10%); }
  .puces-type { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .puce-type { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 14px; cursor: pointer; min-height: 34px; }
  .puce-type[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .puce-type small, .segments small { opacity: .75; font-weight: 600; }
  .aide-colonne { font-size: 12.5px; color: var(--muted); margin: -2px 4px 2px; }
  .ligne-statut { flex-wrap: wrap; }
  .toast-annuler { pointer-events: auto; margin-left: 10px; border: 0; background: none; color: #fff; font-weight: 700; text-decoration: underline; cursor: pointer; font-size: 14px; }
  .pied .erreur { flex-basis: 100%; margin: 0; order: -1; }
  .form { position: relative; }
  .form > h2 { padding-right: 48px; }
  .fermer-modale { position: absolute; top: 12px; right: 12px; }
  .champ input, .champ select, .champ textarea, .filtres select, .outils select, .ligne-statut select { border-color: color-mix(in srgb, var(--muted) 70%, white); }
  .journal:not(.edition) .suppr-journal { display: none; }
  .carte { position: relative; }
  .lien-carte { all: unset; cursor: pointer; overflow-wrap: anywhere; }
  .lien-carte::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius); }
  .carte-actions { position: relative; z-index: 1; }
  .kanban .lien-carte::after { display: none; }
  .kanban .carte { cursor: pointer; }
  .carte:has(.lien-carte:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
  a.chiffre { text-decoration: none; }
  a.chiffre:hover { border-color: var(--line-strong); }
  .date-lue { font-weight: 600; color: var(--text); }
  .vocal { border: 1px solid var(--line); background: var(--primary-soft); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .vocal .micro { min-height: 64px; font-size: 18px; width: 100%; }

// Référence gardée : le message peut être déplacé dans une fenêtre que l'on

function toast(message, duree = 3200, annuler = null) {

    const b = document.createElement('button');
    b.type = 'button';

  }

  // message n'est visible par-dessus que s'il y entre aussi (popover).

}

/* Dates : toujours des chaînes AAAA-MM-JJ, calculées en UTC pour ne jamais
   glisser d'un jour avec le fuseau. */
function aujourdhui() {
  const n = new Date();
  return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`;
}
function versDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function versIso(d) { return d.toISOString().slice(0, 10); }
function ajouterJours(s, n) { const d = versDate(s); d.setUTCDate(d.getUTCDate() + n); return versIso(d); }
function ecartJours(s, depuis = aujourdhui()) { return Math.round((versDate(s) - versDate(depuis)) / 86400000); }

function paques(an) {
  const a = an % 19, b = Math.floor(an / 100), c = an % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;
  return `${an}-${pad(mois)}-${pad(jour)}`;
}
const feriesCache = {};
function feries(an) {
  if (!feriesCache[an]) {
    const p = paques(an);
    feriesCache[an] = new Set([`${an}-01-01`, ajouterJours(p, 1), `${an}-05-01`, `${an}-05-08`, ajouterJours(p, 39),
      ajouterJours(p, 50), `${an}-07-14`, `${an}-08-15`, `${an}-11-01`, `${an}-11-11`, `${an}-12-25`]);
  }
  return feriesCache[an];
}
function estOuvre(s) { const j = versDate(s).getUTCDay(); return j !== 0 && j !== 6 && !feries(Number(s.slice(0, 4))).has(s); }
function prochainOuvre(s) { let d = s; while (!estOuvre(d)) d = ajouterJours(d, 1); return d; }
function precedentOuvre(s) { let d = s; while (!estOuvre(d)) d = ajouterJours(d, -1); return d; }
function dansJours(n, depuis = aujourdhui()) { return prochainOuvre(ajouterJours(depuis, n)); }
function lundiProchain() { const t = aujourdhui(); const j = versDate(t).getUTCDay(); return prochainOuvre(ajouterJours(t, ((8 - j) % 7) || 7)); }
function dansMois(n) { const d = versDate(aujourdhui()); d.setUTCMonth(d.getUTCMonth() + n); return prochainOuvre(versIso(d)); }
function delaiApres(n) { return n >= 1 && n <= CADENCE.length ? CADENCE[n - 1] : NURTURING; }

const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function dateLongue(s, avecJour = true) {
  const d = versDate(s);
  const an = d.getUTCFullYear() !== versDate(aujourdhui()).getUTCFullYear() ? ` ${d.getUTCFullYear()}` : '';
  return `${avecJour ? JOURS[d.getUTCDay()] + ' ' : ''}${d.getUTCDate()} ${MOIS[d.getUTCMonth()]}${an}`;
}
function dateCourte(s) { const d = versDate(s); return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}`; }
function quand(s) {
  if (!s) return '';
  const e = ecartJours(s);
  if (e === 0) return "aujourd'hui";
  if (e === 1) return 'demain';
  if (e === -1) return 'hier, en retard';
  if (e < -1) return `en retard de ${-e} jours`;
  if (e < 7) return dateLongue(s);
  return `le ${dateLongue(s)}`;
}
function classeQuand(s) { if (!s) return ''; const e = ecartJours(s); return e < 0 ? 'retard' : e === 0 ? 'jour' : ''; }
function instantLisible(iso) {
  const d = new Date(iso);
  const jour = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  const h = d.getHours(), m = d.getMinutes();
  return h === 0 && m === 0 ? jour : `${jour} à ${h} h ${pad(m)}`;
}
function localPourInput(d = new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function euros(n) { return n == null ? '' : new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n); }

/* Markdown très réduit pour le mémo : le texte est échappé d'abord, puis
   seuls gras, italique, titres, listes et liens https sont reconnus. */
function markdown(src) {
  const lignes = esc(src).split('\n');
  let html = '', liste = null;
  const fermer = () => { if (liste) { html += `</${liste}>`; liste = null; } };
  const enLigne = (t) => t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const brute of lignes) {
    const l = brute.trimEnd();
    let m;
    if (!l.trim()) { fermer(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)$/))) { fermer(); html += `<h4>${enLigne(m[1])}</h4>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { if (liste !== 'ul') { fermer(); html += '<ul>'; liste = 'ul'; } html += `<li>${enLigne(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { if (liste !== 'ol') { fermer(); html += '<ol>'; liste = 'ol'; } html += `<li>${enLigne(m[1])}</li>`; continue; }
    fermer();
    html += `<p>${enLigne(l)}</p>`;
  }
  fermer();
  return `<div class="md">${html}</div>`;
}

function surligner(texte, q) {
  const t = String(texte ?? '');
  if (!q) return esc(t);
  const n = sansAccents(t);
  const i = n.indexOf(q);
  if (i < 0) return esc(t);
  // On travaille sur un texte sans accents de même longueur (NFD retire
  // seulement les marques) : on recale sur l'original par caractère.
  const plat = [...t].map((c) => sansAccents(c));
  let pos = 0, debut = -1, fin = -1;
  for (let k = 0; k < plat.length; k++) {
    if (pos === i) debut = k;
    pos += plat[k].length;
    if (pos >= i + q.length && debut >= 0) { fin = k + 1; break; }
  }
  if (debut < 0 || fin < 0) return esc(t);
  const car = [...t];
  return esc(car.slice(0, debut).join('')) + '<mark>' + esc(car.slice(debut, fin).join('')) + '</mark>' + esc(car.slice(fin).join(''));
}
function extraitAutour(texte, q, rayon = 70) {
  const t = String(texte ?? '').replace(/\s+/g, ' ');
  const i = sansAccents(t).indexOf(q);
  if (i < 0) return t.slice(0, rayon * 2);
  const debut = Math.max(0, i - rayon);
  return (debut > 0 ? '…' : '') + t.slice(debut, i + q.length + rayon) + (i + q.length + rayon < t.length ? '…' : '');
}

class ErreurApi extends Error {}

async function api(methode, corps, requete = '') {
  let r;
  try {
    r = await fetch(API + requete, {
      method: methode,
      headers: { 'X-Cle-Crm': S.cle, ...(corps ? { 'Content-Type': 'application/json' } : {}) },
      body: corps ? JSON.stringify(corps) : undefined,
    });
  } catch {
    throw new ErreurApi(ERREURS.reseau);
  }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { deconnecter(ERREURS.cle_invalide); throw new ErreurApi(ERREURS.cle_invalide); }
  if (!r.ok) {
    const code = String(j.erreur || '');
    throw new ErreurApi(ERREURS[code] || ERREURS[code.split(':')[0]] || `Ça n'a pas marché (${code || r.status}). Ta saisie est gardée, réessaie.`);
  }
  return j;
}

const actif = (l) => !l.archive && l.type !== 'formateur' && l.statut !== 'gagne' && l.statut !== 'perdu';
const contactsDe = (id) => IDX.contacts.get(id) || [];
const activitesDe = (id) => IDX.activites.get(id) || [];
function contactPrincipal(id) {
  const cs = contactsDe(id);
  return cs.find((c) => c.principal) || cs.find((c) => c.email || c.telephone) || cs[0] || null;
}
const nomContact = (c) => (c ? [c.prenom, c.nom].filter(Boolean).join(' ') : '');
const telLien = (t) => `tel:${String(t).replace(/[^\d+]/g, '')}`;
function contactJoignable(id) { const cs = contactsDe(id); return cs.find((c) => c.principal && c.telephone) || cs.find((c) => c.telephone) || null; }
function telephoneDe(l) { const c = contactJoignable(l.id); return (c && c.telephone) || l.telephone || ''; }
// Un SMS ne part que vers un portable (06, 07, ou 069x à La Réunion).
function estMobile(t) { const n = numeroInternational(t); return /^33[67]\d{8}$/.test(n) || /^262(69|63)\d{7}$/.test(n) || (/^\d{10,15}$/.test(n) && !n.startsWith('33') && !n.startsWith('262')); }
function mobileDe(l) { const c = contactsDe(l.id).find((x) => x.telephone && estMobile(x.telephone)); return (c && c.telephone) || (l.telephone && estMobile(l.telephone) ? l.telephone : ''); }
function emailDe(l) { const c = contactsDe(l.id).find((x) => x.email); return c ? c.email : ''; }
function sources() { return [...new Set(D.leads.map((l) => l.source).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr')); }

/* ================= Rendu des vues ================= */

function rendre() {
  const vue = $('#vue');
  $$('.onglets button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.vue === S.vue && (!S.q || S.vue === 'tableau'))));
  const aFaire = D.leads.filter((l) => !l.archive && l.prochaine_relance && ecartJours(l.prochaine_relance) <= 0).length;
  const compteur = $('#compteur');
  compteur.hidden = aFaire === 0;
  compteur.textContent = aFaire;
  document.title = aFaire ? `(${aFaire}) CRM de Gabriel` : 'CRM de Gabriel';
  // Dans le tableau, la recherche filtre les lignes ; ailleurs, elle ouvre les résultats.
  if (S.vue === 'tableau') vue.innerHTML = vueTableau();
  else if (S.q) vue.innerHTML = vueRecherche();
  else if (S.vue === 'pipeline') vue.innerHTML = vuePipeline();
  else if (S.vue === 'memo') vue.innerHTML = vueMemo();
  else if (S.vue === 'formateurs') vue.innerHTML = vueFormateurs();
  else vue.innerHTML = vueJour();
  chargerLogos();
  if (S.vue === 'jour' && !S.q) setTimeout(recosEnFond, 300);
}

function carte(l, { compacte = false } = {}) {
  const c = contactPrincipal(l.id);
  const tel = telephoneDe(l);
  const email = emailDe(l);
  const qui = [nomContact(c), c && c.poste].filter(Boolean).join(', ');
  const relance = l.prochaine_relance
    ? `<p class="relance ${classeQuand(l.prochaine_relance)}">${esc(actionLue(l.prochaine_action))} ${esc(quand(l.prochaine_relance))}${l.relances_sans_reponse ? ` <span class="meta">(${l.relances_sans_reponse} sans réponse)</span>` : ''}</p>`
    : (actif(l) || enSuivi(l) ? '<p class="relance meta">Aucune relance prévue</p>' : '');
  const suivant = enSuivi(l) ? suivantDe(l.suivi) : null;
  const texte = l.prochaine_note || l.besoin || '';
  const sms = mobileDe(l);
  const prim = (a) => (l.prochaine_action === a ? ' primaire' : '');
  // Dans le Pipeline, la carte entière se glisse (un bouton ne démarre pas de glisser) :
  // le clic sur la carte ouvre la fiche, le titre reste un bouton pour le clavier.
  return `<article class="carte" data-id="${l.id}"${compacte ? ' data-act="ouvrir"' : ''}${compacte && matchMedia('(pointer: fine)').matches ? ' draggable="true"' : ''}>
    <div class="carte-haut">${avatar(l, compacte ? 's' : 'm')}<div class="carte-titre"><h3><button type="button" class="lien-carte" data-act="ouvrir">${esc(l.entreprise)}</button></h3>${qui ? `<p class="meta">${esc(qui)}</p>` : ''}</div>${l.suivi ? `<span class="statut s-suivi">${esc(LIB_SUIVI[l.suivi])}</span>` : `<span class="statut s-${l.statut}">${esc(LIB_STATUT[l.statut])}</span>`}</div>
    ${l.formation_debut ? `<p class="meta">Formation : ${esc(periodeFormation(l))}</p>` : ''}
    ${relance}
    ${texte ? `<p class="extrait">${esc(texte)}</p>` : ''}
    ${compacte ? '' : blocReco(l)}
    ${compacte ? '' : `<div class="carte-actions">
      ${tel ? `<a class="btn petit${prim('appel')}" href="${esc(telLien(tel))}" data-act="tel">Appeler</a>` : ''}
      ${email ? `<button type="button" class="btn petit${prim('email')}" data-act="email">Email</button>` : ''}
      ${sms ? '<button type="button" class="btn petit" data-act="sms">SMS</button>' : ''}
      ${contactsLi(l.id).length ? `<button type="button" class="btn petit${liAValider(l) || /^LinkedIn :/.test(l.prochaine_note || '') ? ' primaire' : ''}" data-act="linkedin">LinkedIn</button>` : ''}
      <button type="button" class="btn petit" data-act="appel">Noter un appel</button>
      <button type="button" class="btn petit" data-act="decaler">Décaler</button>
      ${suivant ? `<button type="button" class="btn petit" data-act="suivi-suivant">Étape suivante : ${esc(LIB_SUIVI[suivant])}</button>` : enSuivi(l) ? '' : '<button type="button" class="btn petit lien" data-act="perdu">Perdu</button>'}
    </div>`}
  </article>`;
}

function vueJour() {
  const t = aujourdhui();
  const avecDate = D.leads.filter((l) => !l.archive && l.prochaine_relance);
  const tri = (a, b) => (a.prochaine_relance < b.prochaine_relance ? -1 : a.prochaine_relance > b.prochaine_relance ? 1 : a.entreprise.localeCompare(b.entreprise, 'fr'));
  const retard = avecDate.filter((l) => l.prochaine_relance < t).sort(tri);
  const jour = avecDate.filter((l) => l.prochaine_relance === t).sort(tri);
  const fin = ajouterJours(t, 7);
  const semaine = avecDate.filter((l) => l.prochaine_relance > t && l.prochaine_relance <= fin).sort(tri);
  const sansDate = D.leads.filter((l) => (actif(l) || enSuivi(l)) && !l.prochaine_relance).sort((a, b) => a.entreprise.localeCompare(b.entreprise, 'fr'));
  const parJour = new Map();
  for (const l of semaine) { if (!parJour.has(l.prochaine_relance)) parJour.set(l.prochaine_relance, []); parJour.get(l.prochaine_relance).push(l); }
  const enCours = D.leads.filter(actif).length;
  const heure = new Date().getHours();
  let h = `<div class="salut"><img src="/images/signature/gabriel-vanderbecken.png" alt="" width="52" height="52"><div><p class="meta">${heure < 18 ? 'Bonjour' : 'Bonsoir'} Gabriel</p><h1 class="titre-vue">${esc(dateLongue(t).replace(/^./, (c) => c.toUpperCase()))}</h1></div></div>
    <div class="resume-jour">
      <a class="chiffre ${retard.length ? 'alerte-chiffre' : ''}" href="#g-retard"><b>${retard.length}</b>en retard</a>
      <a class="chiffre" href="#g-jour"><b>${jour.length}</b>pour aujourd'hui</a>
      <a class="chiffre" href="#g-semaine"><b>${semaine.length}</b>dans les 7 jours</a>
      <span class="chiffre"><b>${enCours}</b>leads en cours</span>
    </div>`;
  const dus = [...retard, ...jour];
  if (dus.length) {
    const parAction = (a) => dus.filter((l) => l.prochaine_action === a);
    const emails = parAction('email'), appels = parAction('appel');
    const autres = dus.filter((l) => l.prochaine_action !== 'email' && l.prochaine_action !== 'appel');
    h += `<div class="actions" style="margin-top:14px">
      <button type="button" class="btn primaire" data-enchainer="tout">Enchaîner les ${dus.length} relances</button>
      <button type="button" class="btn" data-enchainer="tout" data-a-la-voix>Les traiter à la voix</button>
      ${emails.length && emails.length < dus.length ? `<button type="button" class="btn" data-enchainer="email">Les emails (${emails.length})</button>` : ''}
      ${appels.length && appels.length < dus.length ? `<button type="button" class="btn" data-enchainer="appel">Les appels (${appels.length})</button>` : ''}
      ${autres.length && autres.length < dus.length ? `<button type="button" class="btn" data-enchainer="autre">Le reste (${autres.length})</button>` : ''}
    </div>`;
    S.dusDuJour = { tout: dus.map((l) => l.id), email: emails.map((l) => l.id), appel: appels.map((l) => l.id), autre: autres.map((l) => l.id) };
  }
  h += barreLinkedin();
  h += blocPaiements();
  h += blocATrier();
  S.ecartesEnBas = blocEcartes();
  if (retard.length) h += `<h2 class="groupe retard" id="g-retard">En retard <span>${retard.length}</span></h2><div class="grille">${retard.map((l) => carte(l)).join('')}</div>`;
  h += `<h2 class="groupe" id="g-jour">Aujourd'hui <span>${jour.length}</span></h2>`;
  const prochain = semaine[0] || D.leads.filter((l) => !l.archive && l.prochaine_relance > fin).sort((a, b) => a.prochaine_relance.localeCompare(b.prochaine_relance))[0];
  const nbProchain = prochain ? D.leads.filter((l) => !l.archive && l.prochaine_relance === prochain.prochaine_relance).length : 0;
  h += jour.length ? `<div class="grille">${jour.map((l) => carte(l)).join('')}</div>` : `<p class="vide">${retard.length ? "Rien d'autre de prévu aujourd'hui." : "Rien de prévu aujourd'hui."}${prochain ? ` Prochaines relances : ${esc(dateLongue(prochain.prochaine_relance))} (${nbProchain} lead${nbProchain > 1 ? 's' : ''}).` : ''}</p>`;
  let premierJour = true;
  for (const [d, ls] of parJour) h += `<h2 class="groupe"${premierJour ? ((premierJour = false), ' id="g-semaine"') : ''}>${esc(dateLongue(d))} <span>${ls.length}</span></h2><div class="grille">${ls.map((l) => carte(l)).join('')}</div>`;
  if (sansDate.length) h += `<h2 class="groupe">Sans relance prévue <span>${sansDate.length}</span></h2><div class="grille">${sansDate.map((l) => carte(l)).join('')}</div>`;
  return h + (S.ecartesEnBas || '');
}

S.pipeline = localStorage.getItem('crm_pipeline') === 'suivi' ? 'suivi' : 'ventes';
S.typePipeline = 'tous';
function ongletsPipeline() {
  const n = D.leads.filter(enSuivi).length;
  return `<div class="segments" role="tablist" aria-label="Pipeline">
    <button type="button" role="tab" data-pipeline="ventes" aria-selected="${S.pipeline === 'ventes'}">Ventes</button>
    <button type="button" role="tab" data-pipeline="suivi" aria-selected="${S.pipeline === 'suivi'}">Suivi client <small>${n}</small></button></div>`;
}
function vueSuivi() {
  const ls = D.leads.filter(enSuivi);
  const tri = (a, b) => (a.prochaine_relance || '9999') < (b.prochaine_relance || '9999') ? -1 : (a.prochaine_relance || '9999') > (b.prochaine_relance || '9999') ? 1 : a.entreprise.localeCompare(b.entreprise, 'fr');
  const enCours = ls.filter((l) => l.suivi !== 'payee');
  const aEncaisser = enCours.reduce((x, l) => x + (Number(l.valeur) || 0), 0);
  let h = `<h1 class="titre-vue">Suivi client</h1>${ongletsPipeline()}<p class="sous-titre">${enCours.length ? `${enCours.length} formation${enCours.length > 1 ? 's' : ''} en cours` : 'Aucune formation en cours'}${aEncaisser ? `, ${esc(euros(aEncaisser))} à encaisser` : ''}. Un lead « Gagné » arrive dans « À lancer ». Glisse la carte ou touche « Étape suivante » sur sa fiche : la tâche d'après se prévoit seule.</p><div class="kanban">`;
  for (const [cle, lib] of SUIVIS) {
    const cs = ls.filter((l) => l.suivi === cle).sort(tri);
    const valeur = cs.reduce((x, l) => x + (Number(l.valeur) || 0), 0);
    h += `<section class="colonne" data-suivi="${cle}" aria-label="${esc(lib)}"><header><span>${esc(lib)} <small>${cs.length}</small></span>${valeur ? `<small>${esc(euros(valeur))}</small>` : ''}</header>
      <p class="aide-colonne">${esc(AIDE_SUIVI[cle])}</p>
      ${cs.map((l) => carte(l, { compacte: true })).join('') || '<p class="vide">Aucun client</p>'}</section>`;
  }
  return h + '</div>';
}
function vuePipeline() {
  if (S.pipeline === 'suivi') return vueSuivi();
  const tous = D.leads.filter((l) => !l.archive && l.type !== 'formateur');
  const leads = tous.filter((l) => S.typePipeline === 'tous' || l.type === S.typePipeline);
  const tri = (a, b) => (a.prochaine_relance || '9999') < (b.prochaine_relance || '9999') ? -1 : (a.prochaine_relance || '9999') > (b.prochaine_relance || '9999') ? 1 : a.entreprise.localeCompare(b.entreprise, 'fr');
  const total = leads.filter(actif).reduce((s, l) => s + (Number(l.valeur) || 0), 0);
  const puces = [['tous', 'Tous'], ...TYPES.filter(([k]) => k !== 'formateur')].map(([k, v]) => { const n = k === 'tous' ? tous.length : tous.filter((l) => l.type === k).length; return n || k === 'tous' ? `<button type="button" class="puce-type" data-type-pipeline="${k}" aria-pressed="${S.typePipeline === k}">${esc(v)} <small>${n}</small></button>` : ''; }).join('');
  let h = `<h1 class="titre-vue">Pipeline</h1>${ongletsPipeline()}<div class="puces-type" role="group" aria-label="Type">${puces}</div><p class="sous-titre">${leads.filter(actif).length} en cours${total ? `, ${esc(euros(total))} en jeu` : ''}. Glisse une carte pour changer d'étape. Passer en « Gagné » envoie le lead dans le suivi client.</p><div class="kanban">`;
  for (const [cle, lib] of STATUTS) {
    const ls = leads.filter((l) => l.statut === cle).sort(tri);
    const valeur = ls.reduce((s, l) => s + (Number(l.valeur) || 0), 0);
    h += `<section class="colonne" data-statut="${cle}" aria-label="${esc(lib)}"><header><span>${esc(lib)} <small>${ls.length}</small></span>${valeur ? `<small>${esc(euros(valeur))}</small>` : ''}</header>
      ${ls.map((l) => carte(l, { compacte: true })).join('') || '<p class="vide">Aucun lead</p>'}</section>`;
  }
  return h + '</div>';
}

function vueRecherche() {
  const q = sansAccents(S.q.trim());
  const trouves = [];
  for (const l of D.leads) {
    const lignes = [];
    const champs = [['Besoin', l.besoin], ['Source', l.source], ['Secteur', l.secteur], ['Lieu', l.localisation], ['Prochaine étape', l.prochaine_note],
      ['Tags', (l.tags || []).join(', ')], ['SIRET', l.siret], ['Téléphone', l.telephone]];
    const nomOk = sansAccents(l.entreprise).includes(q);
    for (const [nom, v] of champs) if (v && sansAccents(v).includes(q)) lignes.push(`${esc(nom)} : ${surligner(extraitAutour(v, q), q)}`);
    for (const c of contactsDe(l.id)) {
      const t = [nomContact(c), c.poste, c.email, c.telephone, c.notes].filter(Boolean).join(', ');
      if (sansAccents(t).includes(q)) lignes.push(`Contact : ${surligner(extraitAutour(t, q), q)}`);
    }
    for (const a of activitesDe(l.id)) {
      const t = `${a.resume} ${a.contenu || ''}`;
      if (sansAccents(t).includes(q)) lignes.push(`${esc(LIB_ACTIVITE[a.type])} du ${esc(instantLisible(a.date))} : ${surligner(extraitAutour(t, q), q)}`);
    }
    if (nomOk || lignes.length) trouves.push({ l, lignes, score: (nomOk ? 100 : 0) + lignes.length });
  }
  trouves.sort((a, b) => b.score - a.score);
  const memos = D.memos.filter((m) => sansAccents(`${m.titre} ${m.contenu} ${m.categorie}`).includes(q));
  const modeles = D.modeles.filter((m) => sansAccents(`${m.nom} ${m.objet} ${m.corps} ${m.usage || ''}`).includes(q));
  let h = `<h1 class="titre-vue">Résultats pour « ${esc(S.q.trim())} »</h1>
    <p class="sous-titre">${trouves.length} lead${trouves.length > 1 ? 's' : ''}, ${memos.length + modeles.length} fiche${memos.length + modeles.length > 1 ? 's' : ''} du mémo</p>`;
  h += trouves.map(({ l, lignes }) => `<div class="trouve" data-id="${l.id}" data-act="ouvrir" tabindex="0" role="button">
      <h3>${surligner(l.entreprise, q)} <span class="statut s-${l.statut}">${esc(LIB_STATUT[l.statut])}</span></h3>
      <ul>${lignes.slice(0, 6).map((x) => `<li>${x}</li>`).join('')}${lignes.length > 6 ? `<li>et ${lignes.length - 6} autres passages</li>` : ''}</ul></div>`).join('');
  if (memos.length || modeles.length) {
    h += '<h2 class="groupe">Dans le mémo</h2>';
    h += memos.map((m) => `<div class="trouve" data-act="voir-memo" data-memo="${m.id}" tabindex="0" role="button"><h3>${surligner(m.titre, q)}</h3><ul><li>${esc(m.categorie)} : ${surligner(extraitAutour(m.contenu, q), q)}</li></ul></div>`).join('');
    h += modeles.map((m) => `<div class="trouve" data-act="voir-memo" data-memo="modeles" tabindex="0" role="button"><h3>Modèle : ${surligner(m.nom, q)}</h3><ul><li>${surligner(extraitAutour(`${m.objet} ${m.corps}`, q), q)}</li></ul></div>`).join('');
  }
  if (!trouves.length && !memos.length && !modeles.length) h += `<p class="vide">Rien trouvé. Essaie un autre mot (prénom, entreprise, ville, mot du besoin).</p><p><button type="button" class="btn" data-act="creer-depuis-recherche">Créer le lead « ${esc(S.q.trim())} »</button></p>`;
  return h;
}

function vueMemo() {
  const cats = new Map();
  for (const m of D.memos) { if (!cats.has(m.categorie)) cats.set(m.categorie, []); cats.get(m.categorie).push(m); }
  let h = `<h1 class="titre-vue">Mémo commercial</h1>
    <p class="sous-titre">Ce qu'on a décidé sur l'offre, les prix, les relances et la façon de parler aux prospects. La recherche en haut fouille aussi ici.</p>
    <div class="actions" style="margin-top:10px"><button type="button" class="btn petit" data-act="memo-nouveau">Ajouter une fiche</button><button type="button" class="btn petit" data-act="modele-nouveau">Ajouter un modèle d'email</button></div>`;
  if (!D.memos.length) h += '<p class="vide" style="margin-top:14px">Le mémo est vide pour le moment.</p>';
  for (const [cat, ms] of cats) {
    h += `<section class="memo-cat"><h2 class="groupe">${esc(cat)} <span>${ms.length}</span></h2>`;
    h += ms.map((m) => `<details class="memo" id="memo-${m.id}"><summary>${esc(m.titre)}</summary><div class="corps">${markdown(m.contenu)}
      ${(m.sources || []).length || m.date_maj ? `<p class="petites-sources">${m.date_maj ? `À jour du ${esc(dateCourte(m.date_maj))}. ` : ''}${(m.sources || []).length ? `Sources : ${esc(m.sources.join(' ; '))}` : ''}</p>` : ''}
      <div class="actions" style="margin-top:10px"><button type="button" class="btn petit" data-act="memo-modifier" data-memo="${m.id}">Modifier</button></div></div></details>`).join('');
    h += '</section>';
  }
  h += `<section class="memo-cat" id="memo-modeles"><h2 class="groupe">Modèles d'emails <span>${D.modeles.length}</span></h2>`;
  h += D.modeles.map((m) => `<details class="memo"><summary>${m.canal === 'sms' ? 'SMS : ' : ''}${esc(m.nom)}</summary><div class="corps">
      ${m.usage ? `<p class="aide">${esc(m.usage)}</p>` : ''}
      <p style="margin-top:8px"><b>Objet :</b> ${esc(m.objet)}</p>
      <div class="md"><pre>${esc(m.corps)}</pre></div>
      <div class="actions" style="margin-top:10px"><button type="button" class="btn petit" data-act="modele-modifier" data-modele="${m.id}">Modifier</button></div></div></details>`).join('') || '<p class="vide">Aucun modèle.</p>';
  return h + '</section>';
}

/* ================= Fiche d'un lead ================= */

function ouvrirFiche(id) {
  S.fiche = id;
  recapAuto(id);
  rendreFiche();
  const f = $('#fiche');
  if (!f.open) { f.showModal(); f.scrollTop = 0; }
}

function rendreFiche() {
  const f = $('#fiche');
  const l = IDX.lead.get(S.fiche);
  if (!l) { if (f.open) f.close(); return; }
  const defile = f.scrollTop;
  const cs = contactsDe(l.id);
  const acts = activitesDe(l.id);
  const sous = [l.secteur, l.localisation].filter(Boolean).join(', ');
  const infos = [['Besoin', l.besoin], ['Source', l.source], ['Valeur', l.valeur != null ? euros(l.valeur) : ''], ['Service demandé', l.service], ['Budget', l.budget],
    ['Téléphone', l.telephone], ['Site web', l.site_web], ['Adresse', l.adresse], ['SIRET', l.siret], ['Tags', (l.tags || []).join(', ')],
    ['Formation', periodeFormation(l)], ['Financeur', [l.financeur, l.financement_ref && `dossier ${l.financement_ref}`].filter(Boolean).join(', ')],
    ['Dernier contact', l.dernier_contact ? dateCourte(l.dernier_contact) : ''], ['Fiche HubSpot', l.hubspot_id], ['Raison de la perte', l.raison_perte],
    ['Créé le', l.created_at ? instantLisible(l.created_at) : '']].filter(([, v]) => v);
  const lienInfo = (nom, v) => {
    if (nom === 'Téléphone') return `<a href="${esc(telLien(v))}">${esc(v)}</a>`;
    if (nom === 'Site web') { const u = /^https?:\/\//.test(v) ? v : `https://${v}`; return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(v)}</a>`; }
    return esc(v);
  };
  f.setAttribute('aria-labelledby', 'titre-fiche');

// Avant le 07/11, la première de la liste lisait ; sur Mac, c'était une voix gadget (Eddy, Grandma, Rocko…).
const VOIX_GADGET = /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|jacques|albert|bahh|bells|boing|bubbles|cellos|wobble|jester|organ|superstar|trinoids|whisper|zarvox|fred|junior|kathy|ralph|good news|bad news)\b/i;
function noteVoix(v) {
  let n = /^fr(-|_)FR/i.test(v.lang) ? 0 : 40;
  if (/natural|neural/i.test(v.name)) n -= 30; // Edge : « Microsoft … Online (Natural) »
  else if (/premium/i.test(v.name)) n -= 25;
  else if (/enhanced|am[ée]lior[ée]e/i.test(v.name)) n -= 20;
  else if (/^google/i.test(v.name)) n -= 15;
  if (VOIX_GADGET.test(v.name)) n += 100;
  return n;
}
function voixFrancaises() {
  if (!window.speechSynthesis) return [];
  return speechSynthesis.getVoices().filter((v) => /^fr/i.test(v.lang)).sort((a, b) => noteVoix(a) - noteVoix(b));
}
function voix() {
  const liste = voixFrancaises();

  return liste.find((v) => v.voiceURI === choisie) || liste[0] || null;
}
const voixNavigateurUtilisee = () => !(D && D.voix && !S.voixNavigateur);

// Chrome coupe une lecture longue (vers 15 s) et oublie parfois de dire qu'elle est finie :
// on lit phrase par phrase, et un minuteur de secours enchaîne quand même.
let paroleJeton = 0;
function morceauxParole(texte) {
  const phrases = String(texte).replace(/\s+/g, ' ').match(/[^.!?…;:]+[.!?…;:]*/g) || [String(texte)];
  const out = [];
  let cur = '';
  for (const ph of phrases) { if (cur && (cur + ph).length > 180) { out.push(cur.trim()); cur = ''; } cur += ph; }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
// Voix ElevenLabs quand le serveur l'a (D.voix) : bien plus naturelle que celle du navigateur.
// Un seul lecteur audio, « déverrouillé » au clic qui lance l'oral (iPhone exige un geste pour le premier son).
const LECTEUR = new Audio();
const VOIX_CACHE = new Map();
function deverrouillerAudio() {
  if (!D || !D.voix || LECTEUR.dataset.ok) return;
  const n = 400, o = new ArrayBuffer(44 + n), v = new DataView(o);
  const ecrire = (i, t) => [...t].forEach((c, k) => v.setUint8(i + k, c.charCodeAt(0)));
  ecrire(0, 'RIFF'); v.setUint32(4, 36 + n, true); ecrire(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); ecrire(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  LECTEUR.src = URL.createObjectURL(new Blob([o], { type: 'audio/wav' }));
  LECTEUR.play().then(() => { LECTEUR.dataset.ok = '1'; }).catch(() => {});

async function audioPour(texte) {
  if (VOIX_CACHE.has(texte)) return VOIX_CACHE.get(texte);
  const r = await fetch(API, { method: 'POST', headers: { 'X-Cle-Crm': S.cle, 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'voix', texte }) });
  if (!r.ok) throw new Error('voix');
  const url = URL.createObjectURL(await r.blob());
  if (texte.length <= 80) VOIX_CACHE.set(texte, url);
  return url;
}
function parler(texte, ensuite) {
  const jeton = ++paroleJeton;
  let fait = false;
  let garde = null;
  const fin = () => { if (fait || jeton !== paroleJeton) return; fait = true; clearTimeout(garde); if (ensuite) ensuite(); };
  if (!texte) { fin(); return; }
  if (D && D.voix && !S.voixNavigateur) {
    if (window.speechSynthesis) speechSynthesis.cancel();
    LECTEUR.pause();
    garde = setTimeout(fin, 15000 + String(texte).length * 90);
    // La voix ElevenLabs ne répond pas ou le son ne se lit pas : la voix du navigateur prend le relais pour toute la séance.
    const secours = () => {
      if (fait || jeton !== paroleJeton) return;
      S.voixNavigateur = true;
      clearTimeout(garde);
      fait = true;
      parler(texte, ensuite);
    };
    audioPour(String(texte)).then((url) => {
      if (jeton !== paroleJeton) return;
      LECTEUR.onended = fin;
      LECTEUR.onerror = secours;
      LECTEUR.src = url;
      return LECTEUR.play();
    }).catch(secours);
    return;
  }
  if (!window.speechSynthesis) { fin(); return; }
  speechSynthesis.cancel();
  const morceaux = morceauxParole(texte);
  garde = setTimeout(fin, 3000 + String(texte).length * 85);
  setTimeout(() => {
    if (jeton !== paroleJeton) return;
    morceaux.forEach((m, i) => {
      const u = new SpeechSynthesisUtterance(m);
      u.lang = 'fr-FR';
      u.rate = 1.05;
      const v = voix();
      if (v) u.voice = v;
      if (i === morceaux.length - 1) { u.onend = fin; u.onerror = fin; }
      speechSynthesis.speak(u);

}
// Une écoute à la fois ; surFin(texte, erreur) n'est appelé qu'une fois.
// longue : on laisse finir la phrase et on coupe après 2 s de silence.
let ecouteEnCours = null;
function arreterEcoute() {
  const r = ecouteEnCours;
  ecouteEnCours = null;
  if (r) { r.ignorer = true; try { r.abort(); } catch { /* rien */ } }
}
function ecouter(surTexte, surFin, { longue = false } = {}) {
  if (!Reco) { surFin('', 'indisponible'); return; }
  arreterEcoute();
  const r = new Reco();
  r.lang = 'fr-FR';
  r.interimResults = true;
  r.continuous = longue;
  let texte = '';
  let erreur = '';
  let fini = false;
  let silence = null;
  const couper = () => { try { r.stop(); } catch { finir(); } };
  const maxi = setTimeout(couper, longue ? 30000 : 15000);
  const finir = () => {
    if (fini) return;
    fini = true;
    clearTimeout(silence);
    clearTimeout(maxi);
    if (ecouteEnCours === r) ecouteEnCours = null;
    if (!r.ignorer) surFin(texte.trim(), erreur);
  };
  r.onresult = (e) => {
    texte = [...e.results].map((x) => x[0].transcript).join(' ');
    surTexte(texte);
    if (longue) { clearTimeout(silence); silence = setTimeout(couper, 2000); }
  };
  r.onerror = (e) => { erreur = e.error || 'erreur'; finir(); };
  r.onend = finir;
  ecouteEnCours = r;
  try { r.start(); } catch { erreur = 'demarrage'; finir(); }
}

// Met le panneau à jour sans perdre ce qui est en train d'être écrit.

function voixActive(l, tour) {

    if (erreur === 'audio-capture') { pauseVocal('Aucun micro trouvé sur cet appareil.'); return; }
    if (erreur === 'network') { pauseVocal("La reconnaissance vocale n'a pas de réseau. Touche Reprendre, ou écris ta réponse."); return; }

// Ta réponse : les mots de commande d'abord, sinon Claude la comprend et je l'exécute.
async function traiterPhrase(l, texte) {
  const s = S.session;
  const brut = texte.trim();
  const cmd = sansAccents(brut).replace(/[’]/g, "'").replace(/[.!?,;]/g, '').trim();
  s.transcrit = brut;
  if (/^(suivant|passe|on passe|au suivant|je passe|passer)\b/.test(cmd)) { executerVocal(l, { action: 'passer', confirmation: 'Je passe.', texte: brut }); return; }
  if (/^(annule|annuler|non annule|c'?est pas ca|reviens|retour)\b/.test(cmd)) { annulerDerniere(); return; }
  if (/^(stop|arrete|pause|on arrete|termine|c'?est fini|fin)\b/.test(cmd)) { pauseVocal('Je me mets en pause.'); return; }
  if (/^(relis|repete|redis|tu peux repeter)\b/.test(cmd)) { s.pause = false; cycleVocal(l, nouveauTour()); return; }
  etatVocal('reflexion');
  let r;
  try { r = await api('POST', { op: 'vocal', lead_id: l.id, texte: brut }); } catch (e) { erreurVocal(l, e.message); return; }
  if (S.session !== s || s.ids[s.i] !== l.id) return; // la fiche a changé entre-temps
  if (r.action === 'incompris') {
    const question = r.confirmation || "Je n'ai pas compris. Redis-le autrement.";
    const tour = nouveauTour();
    etatVocal('lecture', question);
    parler(question, () => ecouterVocal(l, tour));
    return;
  }
  executerVocal(l, r);
}

        { prochaine_relance: r.rdv_date, prochaine_action: 'rdv', prochaine_note: `RDV${heure}${r.rdv_lieu ? `, ${r.rdv_lieu}` : ''}`, relances_sans_reponse: 0, dernier_contact: t, ...(['nouveau', 'contacte'].includes(l.statut) ? { statut: 'qualifie' } : {}) },

// « Annule » : la dernière action est défaite et on revient sur ce lead.
async function annulerDerniere() {

  if (!s) return;
  const d = s.derniere;
  const ici = IDX.lead.get(s.ids[Math.min(s.i, s.ids.length - 1)]);
  if (!d) { if (ici && s.vocal) { const tour = nouveauTour(); parler('Rien à annuler.', () => ecouterVocal(ici, tour)); } return; }
  s.derniere = null;
  arreterVocal();
  if (!d.passe) await annulerAction(d.leadId, d.activite, d.avant);

  s.luPour = null;
  s.finAnnoncee = false;
  s.pause = false;
  s.dernierTexte = '';
  s.annonceSuivant = false;

// Une photo est réduite avant l'envoi : une requête est limitée à quelques Mo.
async function preparerFichier(fichier) {
  if (fichier.type === 'application/pdf') return { donnees: fichier, nom: fichier.name };
  if (!fichier.type.startsWith('image/')) throw new ErreurApi('Format non accepté : PDF, JPEG ou PNG.');
  const image = await createImageBitmap(fichier).catch(() => null);
  if (!image) throw new ErreurApi('Image illisible : envoie un PDF, ou une photo JPEG ou PNG.');
  const k = Math.min(1, 2000 / Math.max(image.width, image.height));
  const c = document.createElement('canvas');
  c.width = Math.round(image.width * k); c.height = Math.round(image.height * k);
  c.getContext('2d').drawImage(image, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  return { donnees: blob, nom: fichier.name.replace(/\.[a-z0-9]+$/i, '') + '.jpg' };
}

/* ----- Les échanges d'un lead : ses fils Gmail, lus en entier ----- */

const FIL_RE = /^[0-9a-f]{6,32}$/i;
function filsDuLead(leadId) {
  const fils = new Map();
  for (const a of activitesDe(leadId)) {
    const f = a.meta && a.meta.fil;
    if (!f || !FIL_RE.test(f)) continue;
    const x = fils.get(f) || { fil: f, objet: '', dernier: a.date, n: 0 };
    x.n++;
    if (!x.objet) x.objet = String(a.meta.objet || (String(a.resume).match(/« (.+) »/) || [])[1] || a.resume).replace(/^((re|tr|fwd?)\s*:\s*)+/i, '');
    if (a.date > x.dernier) x.dernier = a.date;
    fils.set(f, x);
  }
  return [...fils.values()].sort((a, b) => (a.dernier < b.dernier ? 1 : -1));
}
function boutonEchanges(l) {
  const n = filsDuLead(l.id).length;
  if (!D.gmail || (!n && !contactsDe(l.id).some((c) => c.email))) return '';
  const tache = l.tache_fil && FIL_RE.test(l.tache_fil);
  return `<div class="actions" style="margin-top:8px"><button type="button" class="btn petit${tache ? ' primaire' : ''}" data-act="echanges"${tache ? ` data-fil="${esc(l.tache_fil)}"` : ''}>${tache ? "Lire l'email à traiter" : 'Voir les échanges'}</button>${tache ? '<button type="button" class="btn petit" data-act="echanges">Tous les échanges</button>' : ''}</div>`;
}
const FILS_LUS = new Map();
async function lireFilCrm(fil) {
  if (FILS_LUS.has(fil)) return FILS_LUS.get(fil);

/* ----- Les pièces jointes des emails : ouvrir un PDF ou une image, télécharger le reste ----- */
const OUVRABLES = /^(application\/pdf|image\/(png|jpeg|gif|webp))$/i;
const taillePj = (o) => (o >= 1048576 ? `${(o / 1048576).toFixed(1).replace('.', ',')} Mo` : `${Math.max(1, Math.round((o || 0) / 1024))} Ko`);
const lienGmail = (fil) => `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(COMPTE)}#all/${fil}`;
function piecesHtml(m, fil) {
  if (fil && m.fichiers && m.fichiers.length) {
    return `<ul class="pj-liste" aria-label="Pièces jointes">${m.fichiers.map((f) => `<li><button type="button" class="pj" data-pj="${esc(f.partie)}" data-message="${esc(m.id)}" data-fil="${esc(fil)}" data-nom="${esc(f.nom)}" data-type="${esc(f.type)}" title="${OUVRABLES.test(f.type) ? 'Ouvrir' : 'Télécharger'} ${esc(f.nom)}">${esc(f.nom)} <span class="taille">${esc(taillePj(f.taille))}</span></button></li>`).join('')}</ul>`;
  }
  return m.pieces && m.pieces.length ? `<p class="meta">Pièces jointes : ${esc(m.pieces.join(', '))}</p>` : '';
}
async function ouvrirPieceGmail(b) {
  const ouvrable = OUVRABLES.test(b.dataset.type || '');
  const fenetre = ouvrable ? window.open('', '_blank') : null;
  try {
    const r = await fetch(`${API}?piece=${encodeURIComponent(b.dataset.pj)}&message=${encodeURIComponent(b.dataset.message)}&fil=${encodeURIComponent(b.dataset.fil)}`, { headers: { 'X-Cle-Crm': S.cle } });
    if (r.status === 413) { if (fenetre) fenetre.close(); toast(ERREURS.piece_trop_lourde, 6000); return; }
    if (!r.ok) throw new Error();
    const blob = await r.blob();
    const url = URL.createObjectURL(ouvrable ? blob : new Blob([blob], { type: 'application/octet-stream' }));
    if (fenetre) fenetre.location.href = url;
    else {
      const a = document.createElement('a');
      a.href = url;
      a.download = b.dataset.nom || 'piece-jointe';
      document.body.append(a);
      a.click();
      a.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch {
    if (fenetre) fenetre.close();
    toast("La pièce jointe n'a pas pu s'ouvrir. Réessaie.");
  }
}

// En fond, à l'affichage du jour : les relances dues puis celles de la semaine dont le récap manque ou date.
S.recosEnFond = false;
S.recosFaits = 0; // 25 récaps en fond au plus par visite (la limite de Claude est partagée avec les rédactions)
async function recosEnFond() {
  if (!D.ia || S.recosEnFond || S.recosFaits >= 25) return;
  S.recosEnFond = true;
  try {
    const t = aujourdhui();
    const fin = ajouterJours(t, 7);
    const cibles = D.leads
      .filter((l) => !l.archive && l.prochaine_relance && l.prochaine_relance <= fin && activitesDe(l.id).length && recapPerime(l) && !S.recapTente.has(l.id))
      .sort((a, b) => (a.prochaine_relance < b.prochaine_relance ? -1 : 1))
      .slice(0, 25 - S.recosFaits);
    for (const l of cibles) {
      if (S.recapEnCours.size) await new Promise((ok) => setTimeout(ok, 500));
      S.recosFaits++;
      await faireRecap(l.id, { auto: true });
      const carteEl = $(`#vue .carte[data-id="${l.id}"]`);
      const maj = IDX.lead.get(l.id);
      if (carteEl && maj && S.vue === 'jour' && !S.q) carteEl.outerHTML = carte(maj);
    }
  } finally {
    S.recosEnFond = false;
  }
}

  const z = $(`#session [data-recap="${leadId}"]`);
  const l = IDX.lead.get(leadId);
  if (z && l) z.outerHTML = blocRecap(l, { compact: true });

async function faireRecap(leadId, { auto = false } = {}) {
  if (!D.ia || S.recapEnCours.has(leadId)) return;
  S.recapEnCours.add(leadId);
  S.recapTente.add(leadId);
  majRecaps(leadId);
  try {
    const r = await api('POST', { op: 'recap', lead_id: leadId });
    remplacerLead(r.lead);
    indexer();
  } catch (e) {
    if (!auto) toast(e.message);
  } finally {
    S.recapEnCours.delete(leadId);
    majRecaps(leadId);
  }
}
// À l'ouverture d'une fiche : le récap se fait (ou se refait) tout seul s'il y a du nouveau, une fois par visite.
function recapAuto(leadId) {
  const l = IDX.lead.get(leadId);
  if (!l || !D.ia || S.recapTente.has(leadId) || !activitesDe(leadId).length || !recapPerime(l)) return;
  setTimeout(() => faireRecap(leadId, { auto: true }), 0);
}

function resumeSynchro(r) {
  const g = r.gmail || {}, a = r.agenda || {};
  const n = (g.reponses || 0) + (g.nouveaux || 0) + (a.rdv || 0) + (a.nouveaux || 0);
  const morceaux = [g.reponses && `${g.reponses} email${g.reponses > 1 ? 's' : ''} rangé${g.reponses > 1 ? 's' : ''} sur leurs fiches`, (g.nouveaux || a.nouveaux) && `${(g.nouveaux || 0) + (a.nouveaux || 0)} à trier`, a.rdv && `${a.rdv} RDV`, g.ecartes && `${g.ecartes} écarté${g.ecartes > 1 ? 's' : ''}`, g.envoyes && `${g.envoyes} de tes réponses notée${g.envoyes > 1 ? 's' : ''}`].filter(Boolean);
  return { n, texte: morceaux.join(', ') };
}
// À l'ouverture, une synchro discrète si la dernière date de plus de 10 minutes.
function synchroDiscrete() {
  if (!D || !D.gmail) return;
  const le = D.reglages.synchro_gmail && D.reglages.synchro_gmail.le;
  if (le && Date.now() - Date.parse(le) < 600000) return;
  api('POST', { op: 'synchro' }).then(async (r) => {
    const { n, texte } = resumeSynchro(r);
    if (n) { await actualiser(); toast(`Boîte et agenda : ${texte}.`, 5000); }
  }).catch(() => {});
}

  const i = D.linkedin.findIndex((x) => x.id === a.id);
  if (i >= 0) D.linkedin[i] = a; else D.linkedin.unshift(a);
}
// Ce qui vient ensuite pour une personne, d'après son état et l'historique.
function etapeLiSuivante(c) {
  if (c.linkedin_etat === 'invitation_envoyee') return null;
  const faits = activitesDe(c.lead_id).filter((a) => a.type === 'linkedin' && a.contact_id === c.id && a.meta).map((a) => a.meta.etape);
  if (faits[0] === 'reponse_recue') return 'reponse';
  if (c.linkedin_etat !== 'relation' && !faits.includes('message') && !faits.includes('acceptee')) return 'invitation';
  if (faits.includes('relance')) return 'findia';
  if (faits.includes('message')) return 'relance';
  return 'message';
}
function envoisLiDuJour() {
  const t = aujourdhui();
  const du = actionsLi().filter((a) => a.statut === 'envoye' && a.envoye_le && jourLocal(a.envoye_le) === t);
  return { invitations: du.filter((a) => a.type === 'invitation').length, messages: du.filter((a) => a.type === 'message').length };
}
const jourLocal = (iso) => new Intl.DateTimeFormat('fr-CA', { timeZone: 'Europe/Paris' }).format(new Date(iso));
const quotaInvitations = () => (aujourdhui() <= '2026-11-20' ? 10 : 15);
function etatMac() {
  const r = (D.reglages && D.reglages.linkedin_robot) || {};
  if (!r.dernier_passage) return { texte: "Ton Mac n'est pas encore branché : rien ne part tant qu'il ne l'est pas.", alerte: true };
  const maintenant = new Date().toISOString();
  if (r.pause_jusqua && r.pause_jusqua > maintenant) return { texte: `Ton Mac est en pause jusqu'au ${instantLisible(r.pause_jusqua)} : ${r.raison || 'contrôle de LinkedIn'}.`, alerte: true };
  const min = (Date.now() - Date.parse(r.dernier_passage)) / 60000;
  const h = Number(new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', hourCycle: 'h23' }).format(new Date()));
  const ouvre = estOuvre(aujourdhui()) && h >= 9 && h < 18;
  const vu = min < 60 ? `passé il y a ${Math.max(1, Math.round(min))} min` : `passé ${instantLisible(r.dernier_passage)}`;
  const e = envoisLiDuJour();
  const morceaux = [`Ton Mac est ${vu}`, r.dernier_controle === aujourdhui() ? 'contrôle du matin fait' : 'contrôle du matin à venir', `${e.invitations} invitation${e.invitations > 1 ? 's' : ''} sur ${quotaInvitations()} aujourd'hui`];
  if (r.erreur) morceaux.push(`dernier souci : ${r.erreur}`);
  return { texte: `${morceaux.join(' · ')}.${ouvre && min > 90 ? " Il n'est pas passé depuis longtemps : il doit être allumé et réveillé." : ''}`, alerte: Boolean(r.erreur) || (ouvre && min > 90) };
}

/* ================= Logos des entreprises ================= */
// Le logo vient du site de l'entreprise (ou du domaine de l'email pro), lu par
// le serveur : le navigateur n'appelle personne d'autre que /api/crm.
const WEBMAILS = /^(gmail|googlemail|hotmail|outlook|live|msn|yahoo|ymail|orange|wanadoo|free|sfr|neuf|laposte|icloud|me|mac|aol|gmx|proton|protonmail|bbox|numericable|club-internet|aliceadsl)\./;
const LOGOS = new Map();   // domaine : URL de l'image, 'attente', ou null s'il n'y en a pas
function domaineDe(l) {
  if (l.site_web) {
    try { return new URL(/^https?:/i.test(l.site_web) ? l.site_web : `https://${l.site_web}`).hostname.replace(/^www\./, '').toLowerCase(); } catch { /* site mal écrit */ }
  }
  const email = contactsDe(l.id).map((c) => c.email).find((x) => x && x.includes('@'));
  if (!email) return '';
  const d = email.split('@')[1].toLowerCase().trim();
  return WEBMAILS.test(d) ? '' : d;
}
function initiales(t) {
  const mots = String(t || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean);
  if (!mots.length) return '?';
  return ((mots[0][0] || '') + (mots[1] ? mots[1][0] : (mots[0][1] || ''))).toUpperCase();
}
function teinte(t) { let h = 7; for (const c of String(t)) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
function avatar(l, taille = 'm') {
  const d = domaineDe(l);
  const url = d ? LOGOS.get(d) : null;
  const pret = url && url !== 'attente';
  const attendre = d && !pret && url !== null;
  return `<span class="avatar a-${taille}" style="--h:${teinte(l.entreprise)}"${attendre ? ` data-logo="${esc(d)}"` : ''} aria-hidden="true">${pret ? `<img src="${url}" alt="">` : esc(initiales(l.entreprise))}</span>`;
}
function avatarContact(c) {
  return `<span class="avatar a-s a-rond" style="--h:${teinte(nomContact(c) || c.email || '?')}" aria-hidden="true">${esc(initiales(nomContact(c) || c.email || '?'))}</span>`;
}
let logosPrevus = false;
function chargerLogos() {
  if (logosPrevus) return;
  logosPrevus = true;
  setTimeout(async () => {
    logosPrevus = false;
    const file = [...new Set($$('[data-logo]').map((x) => x.dataset.logo))].filter((d) => !LOGOS.has(d));
    file.forEach((d) => LOGOS.set(d, 'attente'));
    const appliquer = (d) => {
      const url = LOGOS.get(d);
      for (const el of $$(`[data-logo="${CSS.escape(d)}"]`)) {
        el.removeAttribute('data-logo');
        if (url) el.innerHTML = `<img src="${url}" alt="">`;
      }
    };
    const ouvrier = async () => {
      while (file.length) {
        const d = file.shift();
        try {
          const r = await fetch(`${API}?logo=${encodeURIComponent(d)}`, { headers: { 'X-Cle-Crm': S.cle } });
          if (r.status !== 200) throw new Error('pas de logo');
          LOGOS.set(d, URL.createObjectURL(await r.blob()));
        } catch { LOGOS.set(d, null); }
        appliquer(d);
      }
    };
    await Promise.all(Array.from({ length: Math.min(6, file.length) }, ouvrier));
  }, 30);
}

function remplirModele(texte, l, c) {
  const rdv = l.prochaine_action === 'rdv' && l.prochaine_relance ? dateLongue(l.prochaine_relance) : null;
  return String(texte)
    .replace(/\{prenom\}/g, (c && c.prenom) || '')
    .replace(/\{nom\}/g, (c && c.nom) || '')
    .replace(/\{entreprise\}/g, l.entreprise)
    // {besoin} reste à écrire à la main : la note du lead est une note
    // pour soi (« rencontre BNI, m'a dit intéressé »), pas une phrase d'email.
    .replace(/\{date_rdv\}/g, rdv || '{date_rdv}')
    .replace(/Bonjour ,/g, 'Bonjour,');
}
