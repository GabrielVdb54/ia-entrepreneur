function celluleTableau(id, col) { return $(`.tableur tr[data-id="${id}"] [data-col="${col}"]`); }
function activerCellule(cel, focus = true) {
  if (!cel) return;
  $$('.tableur [data-col][tabindex="0"]').forEach((x) => x.setAttribute('tabindex', '-1'));
  cel.setAttribute('tabindex', '0');
  S.actif = { id: cel.closest('tr').dataset.id, col: Number(cel.dataset.col) };
  if (focus) cel.focus({ preventScroll: false });
}
function restaurerCellule() {
  if (S.vue !== 'tableau' || !S.actif) return;
  const cel = celluleTableau(S.actif.id, S.actif.col);
  if (cel) activerCellule(cel, true);
}
function deplacerCellule(cel, dLigne, dCol) {
  const lignes = $$('.tableur tbody tr[data-id]');
  const i = lignes.indexOf(cel.closest('tr'));
  const j = Math.min(COLS.length - 1, Math.max(0, Number(cel.dataset.col) + dCol));
  const k = Math.min(lignes.length - 1, Math.max(0, i + dLigne));
  activerCellule($(`[data-col="${j}"]`, lignes[k]));
}

function editerCellule(cel, depart = null) {
  const c = COLS[Number(cel.dataset.col)];
  if (!c || c.type === 'lecture' || cel.classList.contains('edition')) return;
  const l = IDX.lead.get(cel.closest('tr').dataset.id);
  const avant = valeurCellule(l, c);
  let champ;
  if (c.type === 'choix') {
    champ = document.createElement('select');
    if (c.cle !== 'statut' && c.cle !== 'type' && c.cle !== 'prochaine_action') champ.add(new Option('', ''));
    for (const [k, v] of c.options) champ.add(new Option(v, k, false, k === avant));
  } else {
    champ = document.createElement('input');
    champ.type = c.type === 'date' ? 'date' : c.type === 'email' ? 'email' : c.type === 'tel' ? 'tel' : 'text';
    if (c.type === 'nombre') champ.inputMode = 'decimal';
    champ.value = depart !== null ? depart : String(avant ?? '');
  }
  champ.setAttribute('aria-label', c.titre);
  cel.classList.add('edition');
  cel.innerHTML = '';
  cel.appendChild(champ);
  champ.focus();
  if (champ.select && depart === null && champ.type === 'text') champ.select();
  let fini = false;
  const terminer = async (garder, dLigne = 0, dCol = 0) => {
    if (fini) return;
    fini = true;
    const nouvelle = champ.value.trim();
    cel.classList.remove('edition');
    if (!garder || nouvelle === String(avant ?? '').trim()) {
      cel.innerHTML = c.fige ? celluleEntreprise(l) : affichageCellule(l, c, avant);
      activerCellule(cel);
      if (dLigne || dCol) deplacerCellule(cel, dLigne, dCol);
      return;
    }
    S.actif = { id: l.id, col: Number(cel.dataset.col) };
    try {
      await enregistrerCellule(l, c, nouvelle);
      const cible = celluleTableau(l.id, Number(cel.dataset.col));
      if (cible) { cible.classList.add('enregistre'); activerCellule(cible); if (dLigne || dCol) deplacerCellule(cible, dLigne, dCol); }
    } catch (e) {
      toast(e.message || 'Pas enregistré.');
      rendre();
      restaurerCellule();
    }
  };
  champ.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); terminer(true, ev.shiftKey ? -1 : 1, 0); }
    else if (ev.key === 'Tab') { ev.preventDefault(); terminer(true, 0, ev.shiftKey ? -1 : 1); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); terminer(false); }
  });
  champ.addEventListener('blur', () => terminer(true));
  if (c.type === 'choix') champ.addEventListener('change', () => champ.blur());
}

async function enregistrerCellule(l, c, v) {
  if (c.src === 'contact') {
    if (c.cle === 'email' && v && !/^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/.test(v)) throw new ErreurApi('Adresse email invalide.');
    const ct = contactPrincipal(l.id);
    if (ct) {
      const r = await api('POST', { op: 'maj', table: 'contacts', id: ct.id, valeurs: { [c.cle]: v } });
      Object.assign(ct, r.ligne);
    } else {
      const r = await api('POST', { op: 'creer', table: 'contacts', valeurs: { lead_id: l.id, [c.cle]: v, principal: true } });
      D.contacts.push(r.ligne);
    }
    indexer(); rendre(); restaurerCellule();
    return;
  }
  if (c.cle === 'entreprise' && !v) throw new ErreurApi("Le nom de l'entreprise ne peut pas être vide.");
  if (c.cle === 'statut') { await changerStatut(l.id, v); restaurerCellule(); return; }
  if (c.cle === 'prochaine_relance' || c.cle === 'prochaine_action') {
    const p = { prochaine_relance: l.prochaine_relance, prochaine_action: l.prochaine_action, [c.cle]: v || null };
    if (!p.prochaine_action) p.prochaine_action = 'email';
    await journal(l.id, { type: 'relance_decalee', resume: p.prochaine_relance ? `Relance prévue le ${dateLongue(p.prochaine_relance)} (${actionLue(p.prochaine_action).toLowerCase()}), depuis le tableau` : 'Plus de relance prévue, depuis le tableau', source: 'crm' }, { [c.cle]: v || (c.cle === 'prochaine_action' ? 'email' : null) });
    restaurerCellule();
    return;
  }
  const valeur = c.type === 'nombre' ? (v === '' ? null : v) : v;
  const r = await api('POST', { op: 'maj', table: 'leads', id: l.id, valeurs: { [c.cle]: valeur } });
  remplacerLead(r.ligne);
  if (c.cle === 'source' && v) S.derniereSource = v;
  indexer(); rendre(); restaurerCellule();
}

async function ajoutRapide(input) {
  const nom = input.value.trim();
  if (!nom) return;
  if (D.leads.some((l) => sansAccents(l.entreprise) === sansAccents(nom)) && !confirm(`« ${nom} » existe déjà. Créer une deuxième ligne quand même ?`)) return;
  input.disabled = true;
  try {
    const r = await api('POST', { op: 'creer', table: 'leads', valeurs: { entreprise: nom, source: S.derniereSource || null, prochaine_relance: dansJours(1), prochaine_action: 'email' } });
    D.leads.push(r.ligne);
    indexer();
    S.actif = { id: r.ligne.id, col: 1 };
    rendre();
    restaurerCellule();
    toast(`${nom} ajouté. Complète la ligne, puis Entrée.`);
  } catch (e) {
    toast(e.message);
    input.disabled = false;
  }
}

          } else {

          fermerModale();

      ${blocProchaine('apres', dansJours(1), 'email', '', { aide: 'Même date et même action pour toute la sélection. Le compteur du rythme ne bouge pas.' })}
      ${piedFormulaire('<button type="submit" class="btn primaire">Appliquer</button>')}`, (form) => {
      brancherAnnuler(form);
      brancherPuces(form, 'apres');
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        soumettre(form, async () => {

          if (!p.prochaine_note) delete p.prochaine_note;

          await lot(ids, p, { type: 'relance_decalee', resume: texte, source: 'crm' }, `${n} relance${n > 1 ? 's' : ''} décalée${n > 1 ? 's' : ''}.`);

  ['entreprise', ['entreprise', 'nom entreprise', 'societe', 'raison sociale', 'company', 'organisation', 'structure']],

  ['besoin', ['besoin', 'note', 'notes', 'commentaire', 'commentaires', 'remarque']],
  ['source', ['source', 'origine', 'provenance']],

];
const STATUT_DEPUIS_TEXTE = Object.fromEntries(STATUTS.flatMap(([k, v]) => [[sansAccents(v), k], [k, k]]));

function lireTableauColle(texte) {
  const lignesBrutes = texte.replace(/\r\n?/g, '\n').split('\n').filter((l) => l.trim());
  if (lignesBrutes.length < 2) return null;
  const premiere = lignesBrutes[0];
  const sep = premiere.includes('\t') ? '\t' : (premiere.split(';').length >= premiere.split(',').length ? ';' : ',');
  const decouper = (ligne) => {
    if (sep === '\t') return ligne.split('\t').map((x) => x.trim());
    const cases = []; let cur = ''; let guillemets = false;
    for (let i = 0; i < ligne.length; i++) {
      const ch = ligne[i];
      if (ch === '"') { if (guillemets && ligne[i + 1] === '"') { cur += '"'; i++; } else guillemets = !guillemets; }
      else if (ch === sep && !guillemets) { cases.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cases.push(cur.trim());
    return cases;
  };
  const entetes = decouper(premiere.replace(/^﻿/, ''));
  const carte = entetes.map((h) => {
    const n = sansAccents(h).replace(/\s+/g, ' ').trim();
    const trouve = ENTETES.find(([, noms]) => noms.includes(n));
    return trouve ? trouve[0] : null;
  });
  // « Nom » seul vaut nom du contact, sauf s'il n'y a aucune colonne Entreprise.
  if (!carte.includes('entreprise')) {
    const i = carte.indexOf('nom');
    if (i >= 0 && !carte.includes('prenom')) carte[i] = 'entreprise';
  }
  const lignes = lignesBrutes.slice(1).map(decouper).map((cases) => Object.fromEntries(carte.map((k, i) => [k, cases[i] || '']).filter(([k, v]) => k && v)));
  return { entetes, carte, lignes };
}

function editerCelluleMobile(cel) {

document.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if (t.matches('.ajout-rapide') && ev.key === 'Enter') { ev.preventDefault(); ajoutRapide(t); return; }
  if (!t.matches('.tableur [data-col]') || t.classList.contains('edition')) return;
  const k = ev.key;
  const mouvements = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (mouvements[k]) { ev.preventDefault(); deplacerCellule(t, ...mouvements[k]); return; }
  if (k === 'Tab') { ev.preventDefault(); deplacerCellule(t, 0, ev.shiftKey ? -1 : 1); return; }
  if (k === 'Home' || k === 'End') { ev.preventDefault(); deplacerCellule(t, 0, k === 'Home' ? -99 : 99); return; }
  if (k === ' ' && ev.shiftKey) { ev.preventDefault(); const box = $('[data-sel]', t.closest('tr')); box.click(); restaurerCellule(); return; }
  if ((ev.metaKey || ev.ctrlKey) && k.toLowerCase() === 'c') { navigator.clipboard?.writeText(String(valeurCellule(IDX.lead.get(t.closest('tr').dataset.id), COLS[Number(t.dataset.col)]) ?? '')); toast('Copié.', 1200); return; }
  if (k === 'Enter' || k === 'F2') { ev.preventDefault(); editerCellule(t); return; }
  if (k === 'Backspace' || k === 'Delete') { ev.preventDefault(); const c = COLS[Number(t.dataset.col)]; if (c.type !== 'choix' && !c.fige) editerCellule(t, ''); return; }
  if (k.length === 1 && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
    const c = COLS[Number(t.dataset.col)];
    if (c.type === 'texte' || c.type === 'email' || c.type === 'tel' || c.type === 'nombre') { ev.preventDefault(); editerCellule(t, k); }

});

/* ================= SMS et WhatsApp depuis ton téléphone ================= */

const GSM = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà^{}\\[~]|€';
function compteSms(t) {
  const car = [...t];
  const gsm = car.every((x) => GSM.includes(x));
  const par = gsm ? (car.length <= 160 ? 160 : 153) : (car.length <= 70 ? 70 : 67);
  return { n: car.length, sms: Math.max(1, Math.ceil(car.length / par)), gsm };
}
// 06 12 34 56 78 donne 33612345678 ; 0692… (La Réunion) donne 262692…
function numeroInternational(t) {
  const d = String(t || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (/^0(262|263|269|639|692|693)\d{6}$/.test(d)) return `262${d.slice(1)}`;
  if (/^0\d{9}$/.test(d)) return `33${d.slice(1)}`;
  return d;
}
const lienSms = (tel, texte) => `sms:+${numeroInternational(tel)}?&body=${encodeURIComponent(texte)}`;
const lienWhatsapp = (tel, texte) => `https://wa.me/${numeroInternational(tel)}?text=${encodeURIComponent(texte)}`;

function ouvrirSms(leadId) {
  const l = IDX.lead.get(leadId);
  const numeros = contactsDe(leadId).filter((c) => c.telephone && estMobile(c.telephone)).map((c) => ({ id: c.id, tel: c.telephone, nom: nomContact(c) || 'Contact' }));
  if (l.telephone && estMobile(l.telephone) && !numeros.some((x) => x.tel === l.telephone)) numeros.push({ id: '', tel: l.telephone, nom: 'Entreprise' });
  if (!numeros.length) return toast('Aucun numéro de portable : un SMS ne part que vers un 06 ou un 07.');
  const modeles = D.modeles.filter((m) => m.canal === 'sms');
  const n = (l.relances_sans_reponse || 0) + 1;
  const c0 = contactPrincipal(leadId);
  const depart = `Bonjour${c0 && c0.prenom ? ` ${c0.prenom}` : ''},\n\n\nGabriel, IA-Entrepreneur`;
  ouvrirModale(`
    <h2>SMS à ${esc(l.entreprise)}</h2>

    ${champ('À', `<select name="numero">${numeros.map((x, i) => `<option value="${i}">${esc(x.nom)} (${esc(x.tel)})</option>`).join('')}</select>`)}
    ${modeles.length ? champ('Modèle', `<select name="modele"><option value="">Sans modèle</option>${modeles.map((m) => `<option value="${m.id}">${esc(m.nom)}</option>`).join('')}</select>`) : ''}
    ${blocPerso(leadId)}
    <label class="champ">Message <span class="compteur-sms" data-compte></span><textarea name="texte" required>${esc(depart)}</textarea></label>
    ${S.session && $('#session').open && modeles.length ? '<label class="case"><input type="checkbox" name="garder"> Reprendre ce modèle pour les leads suivants</label>' : ''}
    <div class="actions">
      <a class="btn primaire" data-lien="sms" href="#">Ouvrir dans Messages</a>
      <a class="btn" data-lien="wa" href="#" target="_blank" rel="noopener">Ouvrir dans WhatsApp</a>
    </div>
    <p class="aide">Sur Mac, Messages envoie le SMS si le transfert de SMS est activé sur ton iPhone (Réglages, Messages, Transfert de SMS).</p>
    <div class="confirmation" data-confirmation hidden><p>Le message est parti ?</p><div class="actions"><button type="button" class="btn" data-pas-encore>Pas encore</button><button type="button" class="btn primaire" data-noter>Oui, le noter</button></div></div>
    ${blocProchaine('apres', dansJours(delaiApres(n)), l.prochaine_action === 'appel' ? 'appel' : 'email', n <= CADENCE.length ? `Relance ${n}` : 'Prise de nouvelles', { aide: 'Proposé d\'après le rythme des relances.' })}
    ${piedFormulaire('<button type="button" class="btn lien" data-noter>Déjà envoyé, noter</button>')}
  `, (form) => {
    brancherAnnuler(form);
    brancherPuces(form, 'apres');
    const el = form.elements;
    let canal = 'sms';
    const choisi = () => numeros[Number(el.numero.value)];
    const maj = () => {
      const t = el.texte.value;
      const k = compteSms(t);
      $('[data-compte]', form).textContent = `${k.n} caractères`;
      $('[data-lien="sms"]', form).href = lienSms(choisi().tel, t);
      $('[data-lien="wa"]', form).href = lienWhatsapp(choisi().tel, t);
    };
    const appliquerModele = (id) => {

      const ct = contactsDe(leadId).find((x) => x.id === choisi().id) || c0;
      el.texte.value = remplirModele(m.corps, l, ct).trim();
      maj();
    };
    if (el.modele) el.modele.addEventListener('change', () => appliquerModele(el.modele.value));
    if (el.modele && S.session && S.session.modeleSms) { el.modele.value = S.session.modeleSms; appliquerModele(S.session.modeleSms); }
    el.texte.addEventListener('input', maj);
    el.numero.addEventListener('change', maj);

    for (const a of $$('[data-lien]', form)) {

        fermerModale();

        actionFaite(l.id, 'sms');
      }));
    }
  });
}

document.addEventListener('click', (ev) => {
  const cible = ev.target.closest('[data-act]');
  if (!cible) return;
  const act = cible.dataset.act;
  if (act === 'tel') {
    // Le lien tel: lance l'appel ; au retour sur la page, on propose de le noter.
    const zone = cible.closest('[data-id]');
    S.appel = { id: (zone && zone.dataset.id) || S.fiche, t: Date.now() };
    return;
  }
  const conteneur = cible.closest('[data-id]');
  const leadId = (conteneur && conteneur.dataset.id) || S.fiche;
  if (cible.tagName === 'BUTTON' || act !== 'ouvrir') ev.stopPropagation();
  switch (act) {
    case 'ouvrir': S.journalEdition = false; return ouvrirFiche(leadId);
    case 'fermer-fiche': return $('#fiche').close();
    case 'email': return ouvrirEmail(leadId, cible.dataset.contact);
    case 'appel': return ouvrirAppel(leadId);
    case 'sms': return ouvrirSms(leadId);
    case 'journal-edition': S.journalEdition = !S.journalEdition; return rendreFiche();
    case 'creer-depuis-recherche': { const nom = S.q.trim(); ouvrirNouveau(); const champNom = $('#modale input[name="entreprise"]'); if (champNom) champNom.value = nom; return; }
    case 'importer': return ouvrirImport();
    case 'exporter-tableau': return exporterCsv(leadsDuTableau(), 'tableau');
    case 'decaler': return ouvrirDecaler(leadId);
    case 'rdv': return ouvrirRdv(leadId);
    case 'note': return ouvrirNote(leadId, 'note');
    case 'reponse': return ouvrirNote(leadId, 'email_recu');
    case 'contact-nouveau': return ouvrirContact(S.fiche);
    case 'contact-modifier': return ouvrirContact(S.fiche, cible.dataset.contact);
    case 'infos': return ouvrirInfos(S.fiche);
    case 'archiver': return archiver(S.fiche);
    case 'supprimer-lead': return supprimerLead(S.fiche);
    case 'suppr-activite': return supprimerActivite(cible.dataset.activite);
    case 'memo-nouveau': return ouvrirMemo(null);
    case 'memo-modifier': return ouvrirMemo(cible.dataset.memo);
    case 'modele-nouveau': return ouvrirModele(null);
    case 'modele-modifier': return ouvrirModele(cible.dataset.modele);
    case 'voir-memo': {
      $('#q').value = ''; S.q = ''; S.vue = 'memo'; rendre();
      const cibleMemo = cible.dataset.memo === 'modeles' ? $('#memo-modeles') : $(`#memo-${cible.dataset.memo}`);
      if (cibleMemo) { if (cibleMemo.tagName === 'DETAILS') cibleMemo.open = true; cibleMemo.scrollIntoView({ block: 'start' }); }
      return;
    }
    default:
  }
});

document.addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
  const libre = !ev.target.matches('input, textarea, select, [data-col]') && !$('#modale').open && !$('#fiche').open && !$('#session').open && !ev.metaKey && !ev.ctrlKey;
  if (ev.key === '/' && libre) { ev.preventDefault(); $('#q').focus(); }
  if (ev.key === 'n' && libre) { ev.preventDefault(); ouvrirNouveau(); }
});

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-enchainer]');
  if (!b || !S.dusDuJour) return;
  const titres = { tout: 'Relances du jour', email: 'Emails du jour', appel: 'Appels du jour', autre: 'Le reste du jour' };
  demarrerSession(S.dusDuJour[b.dataset.enchainer] || [], titres[b.dataset.enchainer]);
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'statut-fiche') return changerStatut(t.dataset.lead, t.value);
  if (t.dataset.filtre) {
    S.filtres[t.dataset.filtre] = t.type === 'checkbox' ? t.checked : t.value;
    rendre();
  }
});

$$('.onglets button').forEach((b) => b.addEventListener('click', () => {
  S.vue = b.dataset.vue;
  S.q = ''; $('#q').value = '';
  rendre();
  window.scrollTo(0, 0);
}));

let minuteurRecherche;
$('#q').addEventListener('input', (ev) => {
  clearTimeout(minuteurRecherche);
  minuteurRecherche = setTimeout(() => { S.q = ev.target.value.trim().length >= 2 ? ev.target.value : ''; rendre(); }, 150);
});
$('#btn-nouveau').addEventListener('click', ouvrirNouveau);
$('#btn-reglages').addEventListener('click', ouvrirReglages);
$('#fiche').addEventListener('close', () => { S.fiche = null; });
// Un clic sur le voile ferme le panneau ou la fenêtre.
for (const d of [$('#fiche'), $('#modale')]) {
  d.addEventListener('click', (ev) => { if (ev.target === d) d.close(); });
}

/* Claude peut aussi écrire dans la base (relances préparées depuis Claude
   Code) : on relit en revenant sur l'onglet après 3 minutes. */
async function actualiser() {
  await charger();
  rendre();
  if (S.fiche) rendreFiche();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !D) return;
  if (S.appel && Date.now() - S.appel.t > 4000 && !$('#modale').open && IDX.lead.has(S.appel.id)) {
    const id = S.appel.id;
    S.appel = null;
    ouvrirAppel(id);
    return;
  }
  // Pas d'actualisation pendant une saisie ou une sélection dans le tableau.
  const occupe = $('#modale').open || $('.tableur .edition') || (S.vue === 'tableau' && S.selection.size);
  if (Date.now() - S.chargeA > 180000 && !occupe) actualiser().catch(() => {});
});

/* ================= Connexion ================= */

function deconnecter(message) {
  localStorage.removeItem('crm_cle');
  sessionStorage.removeItem('crm_cle');
  S.cle = '';
  D = null;
  for (const d of [$('#fiche'), $('#modale')]) if (d.open) d.close();
  $('#app').hidden = true;
  $('#ecran-cle').hidden = false;
  const e = $('#erreur-cle');
  e.textContent = message || '';
  e.hidden = !message;
  $('#cle').value = '';
  $('#cle').focus();
}

async function demarrer() {
  $('#ecran-cle').hidden = true;
  $('#app').hidden = false;
  try {
    await charger();
    rendre();
    reprendreSessionSauvee();
  } catch (e) {
    if (S.cle) $('#vue').innerHTML = `<p class="chargement">${esc(e.message)} <button type="button" class="btn petit" onclick="location.reload()">Réessayer</button></p>`;
  }
}

$('#form-cle').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const cle = $('#cle').value.trim();
  if (!cle) return;
  S.cle = cle;
  const bouton = $('#form-cle button');
  bouton.disabled = true;
  try {
    await charger();
    (($('#retenir').checked) ? localStorage : sessionStorage).setItem('crm_cle', cle);
    $('#ecran-cle').hidden = true;
    $('#app').hidden = false;
    rendre();
  } catch (e) {
    const err = $('#erreur-cle');
    err.textContent = e.message;
    err.hidden = false;
  } finally {
    bouton.disabled = false;
  }
});

if (S.cle) demarrer(); else deconnecter('');
</script>
